# 텅스텐 플러그 CMP — 이 파일은 "설계가 진짜인가"를 증명하려고 만들었다.
#
# 2026-09-06: 파라미터 팩 도입 직후, sim/ 의 파이썬 코드를 **한 줄도 건드리지 않고**
# 이 YAML 하나만 새로 써서 W CMP 시뮬레이션이 돌아가는지 확인했다. 돌아갔다.
# 그게 "그 내용만 바꾸면 각각 다른 시뮬레이션을 할수있도록" 지시의 수용 기준이었다.
base: base
description: "W plug CMP: Fe계 산화제 산성 슬러리, 알루미나 연마입자"

params:
  film:
    value: w
    confidence: verified
  abrasive:
    value: alumina
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature

  kp_m_per_pa:
    value: 2.8e-13
    unit: m^2/N
    note: >
      ⚠ 문헌 W MRR 범위(300~600 nm/min @ 3psi)에서 역산한 대표값. 미재현.
      W는 Fe(III)/H2O2 산화 후 기계적 제거라 산화막과 메커니즘이 다르다.
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: estimated

  slurry_ph:
    value: 2.5
    unit: pH
    note: 강산성 — Pourbaix상 W 산화물 용해 억제하며 부동태막 유지
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: literature
  oxidizer:
    value: Fe(NO3)3
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature
  # ── H2O2 산화제 항 (χ 활성화) — US20110186542A1 15조건에서 역산 (2026-09-09) ──
  # ⚠ 이 4개는 그 특허 실시예 표에서 뽑았으므로 그 데이터셋은 used_for_calibration: true.
  #   held-out 검증은 별도 문헌(US8070843B2, 3M Mirra 3400)으로만 한다.
  oxidizer_wt_pct:
    value: 3.0
    unit: "wt%"
    note: 이번 런의 H2O2 농도. Fe(III) 활성제와 공존하는 W 슬러리의 통상 상한 구간.
    source: papers/US20110186542A1.txt
    confidence: literature
  oxidizer_ref_wt_pct:
    value: 3.0
    unit: "wt%"
    note: 기준 농도 — 화학 배수 1.0. 실시예 표의 최고 농도(3 wt%)를 기준으로 상대화했다.
    source: papers/US20110186542A1.txt
    confidence: literature
  oxidizer_peak_wt_pct:
    value: 6.0
    unit: "wt%"
    note: >
      ⚠ 실측 3점(0/1/3 wt%)이 단조 증가라 정점을 직접 못 봤다. Kaufman 단봉을 0→1→3의
      상대비(0.14/0.63/1.0)에 격자 적합해 얻은 값(n=3, log-err 0.012). 3 wt% 위는 외삽.
    source: papers/US20110186542A1.txt
    confidence: estimated
  oxidizer_curve_n:
    value: 3.0
    unit: "-"
    note: 위와 같은 적합에서. 현상론 형상 파라미터.
    source: papers/US20110186542A1.txt
    confidence: estimated
  oxidizer_mech_floor:
    value: 0.14
    unit: "-"
    note: >
      H2O2 0 wt%에서 남는 순수 기계 연마 분율(3 wt% 대비). 15조건 전부에서 0.117~0.189,
      평균 0.142. Kaufman 단봉은 C=0에서 0이라 이 바닥이 없으면 산화제 0 예측이 0이 된다.
    source: papers/US20110186542A1.txt
    confidence: literature
  abrasive_size_nm:
    value: 150.0
    unit: nm
    source: knowledge/cmp/particle-wafer-interaction-mechanical-chemical-balance.md
    confidence: estimated

  # ── psi 표면 보호도 (억제제) — Lee & Seo 2022(DOI:10.3390/app12031227) 재현 (2026-09-10) ──
  # ⚠ 정확도 루프 UNMODELED 갭 해결: w_fe_oxidizer는 이제껏 억제제 파라미터가 없어
  #   부식억제제를 넣어도 ψ(psi)가 계산 안 됐다. sim/chemistry.py::_inhibitor_term은
  #   BTA(cu_h2o2_bta)와 동일 함수를 그대로 재사용한다(함수는 범용, 화학종만 다름).
  inhibitor:
    value: picolinic_acid
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: literature
  inhibitor_mM:
    value: 121.8
    unit: mM
    note: >
      1.5 wt% 피콜린산(포화 농도, 밀도 1 g/mL 근사)에 해당하는 몰농도. 원문 Lee & Seo(2022)
      3.3절에서 정지식각 90->11 A/min(8.2배 감소), CMP 제거율 120->85 A/min(1.41배 감소)의
      실측 포인트. wt%->mol/L 환산은 밀도 근사라 미검증.
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: estimated
  inhibitor_K_L_per_mol:
    value: 1108.0
    unit: L/mol
    note: >
      원문 Table 1 Langmuir 상수 b=0.009 L/mg를 MW=123.11 g/mol로 몰단위 환산. 노트 verify
      블록 PASS(K=1108 L/mol).
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: literature
  inhibitor_ref_mM:
    value: 121.8
    unit: mM
    note: >
      기준 농도 = inhibitor_mM과 동일(1.5 wt% 포화점). 여기서 화학 배수 1.0, 이 팩의
      kp_m_per_pa는 이 농도 근처(원 특허 실시예)에서 역산된 값이라 이중계상 방지를 위해
      일치시켰다.
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: estimated
  inhibitor_strength_k:
    value: 2.117
    unit: "-"
    note: >
      정지식각 90->11 A/min(8.2배 감소) 역산값. Cu/BTA의 k=3.0(cu_h2o2_bta.yaml)과 다른
      화학종 전용 값 — 물질계별로 별도 파라미터가 필요함을 보여준다. 노트 verify PASS.
      0.5wt%에서 모델은 이미 강한 억제를 예측하나 원문은 "억제 실패" 정성 서술 —
      저농도 문턱 거동 불일치(RESPONSE_CONFLICT 후보, 노트 6절 한계 참조).
    source: knowledge/cmp/w-cmp-picolinic-acid-inhibitor-langmuir-dissolution-suppression.md
    confidence: unverified
