# 세리아 슬러리 STI — oxide:nitride 선택비가 핵심. 실리카 팩과 같은 산화막이지만
# 연마 메커니즘이 다르다(Si-O-Ce 화학결합 "chemical tooth"). 같은 film, 다른 팩.
base: oxide_silica
description: "STI CMP: 세리아 슬러리, oxide:nitride 고선택비"

params:
  abrasive:
    value: ceria
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: verified

  kp_m_per_pa:
    value: 2.2e-13
    unit: m^2/N
    note: >
      ⚠ 세리아는 화학결합(Si-O-Ce) 기반이라 실리카보다 산화막 MRR이 높다.
      Netzband 2020에서 H2O2 첨가 시 Ce3+ 증가로 MRR 5.5배 변화가 보고됐는데,
      그건 조성 의존이라 단일 상수로 뭉뚱그린 이 값은 대표값일 뿐이다. 미재현.
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: estimated

  slurry_ph:
    value: 5.5
    unit: pH
    note: 세리아 IEP 6.8 부근 아래 — 약양전하로 실리카 표면(음전하) 정전인력
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: verified
  abrasive_iep_ph:
    value: 6.8
    unit: pH
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: verified
  # ⚠ base(oxide_silica)의 ph_ref=10.5·ph_peak=11.0을 **반드시 덮어쓴다.**
  #   실리카의 pH 정점 모델은 세리아에 적용하면 부호까지 틀린다(IEP가 2.5 vs 6.8).
  #   factors.py가 abrasive=='ceria'를 먼저 보고 IEP 창 모델로 분기하지만,
  #   ph_ref는 그 모델의 기준점으로도 쓰이므로 세리아 작동 pH로 둔다.
  ph_ref:
    value: 5.5
    unit: pH
    note: 세리아 정전 창(2.5~6.8) 안의 기준점 — slurry_ph와 같은 값
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md §4
    confidence: verified
  wafer_iep_ph:
    value: 2.5
    unit: pH
    note: 실리카 산화막 표면 IEP. 정전 창의 하단. 2차 인용 범위(2~3)
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md §4
    confidence: literature
  abrasive_size_nm:
    value: 60.0
    unit: nm
    note: >
      Dandu Veera, Peddeti, Babu 2009 (J. Electrochem. Soc. 156(12) H936-H943,
      doi:10.1149/1.3230624) — Rhodia Inc. 세리아 슬러리, 원문 명시
      "mean diameter d_mean = 60 nm" (무첨가, pH 4-5.5 — 이 팩의 slurry_ph=5.5·
      ph_ref=5.5와 조건 일치). 원문 PDF 1차 확보·완독
      (papers/dandu2009-jes-selective-sio2-sin-ceria-sti.pdf; 상세 재현은
      knowledge/cmp/sti-cmp-ceria-high-selectivity-nitride-stop-dishing.md §5.1·§8[D]).
      같은 논문의 Ferro 소성 세리아는 d_mean=180 nm(첨가제 병행 실험용, 더 높은
      옥사이드 RR). STI 세리아 상용 슬러리는 문헌상 30~230 nm대로 넓게 분포한다
      (예: Hwang·Lyu·Kim 2026 Polymers 18, 1899, doi:10.3390/polym18151899 —
      PAA 함유 HNU15 세리아 DLS d50 155→111 nm, 5h 밀링 후, pH~9.1·무억제제,
      원문 PDF 1차 확보; Urban 2016 Ferro 벤더 슬라이드 D_mean 30-145 nm,
      미검증) — 이 팩은 무첨가·pH 5.5 조건이 이 값(60 nm)과 가장 가깝다고 판단해
      채택. 기존 80 nm(estimated)는 이 범위 안에 있었으나 특정 문헌 근거가
      없었다.
    source: knowledge/cmp/sti-cmp-ceria-high-selectivity-nitride-stop-dishing.md §5.1
    confidence: literature

  # ── Δ 손상 유발도(D99-스크래치) ─────────────────────────
  # ⚠ 이 세 값은 sti_ceria 팩(및 이를 상속하는 sic_ceria_h2o2)의 실제 슬러리
  # 조성에서 측정된 D99가 아니다 — Hitachi Chemical 세리아 STI/ILD CMP 특허
  # (US8439995B2)의 Example 1(D99=700nm, 스크래치 20개, 200mm 전면)을
  # "화학종 일치(세리아, oxide/STI CMP) + 동일 패드계(IC-1000)"라는 근거로
  # 참조 기준점(baseline)에만 쓴다. 이 팩이 실제로 700nm D99 세리아를
  # 쓴다는 뜻이 아니다 — confidence=estimated로 명시한다.
  # abrasive_d99_nm == abrasive_ref_d99_nm(둘 다 700)이므로 기준 조건에서
  # Δ=1.0 계약은 그대로 유지된다. 이 값을 바꾸는 것은 recipe pack_overrides로
  # "D99가 이만큼 커지면/작아지면"을 묻는 what-if 축으로 쓰기 위함이다.
  abrasive_d99_nm:
    value: 700.0
    unit: nm
    note: >
      Hitachi US8439995B2 Example 1 D99(문헌 실측) — 화학종(세리아,
      STI/ILD 산화막 CMP) 일치를 근거로 기준점(baseline)에 이식. 팩의
      실제 조성값 아님, what-if 스캔용 기준.
    source: knowledge/cmp/abrasive-d99-scratch-hitachi-us8439995.md §2.2
    confidence: estimated
  abrasive_ref_d99_nm:
    value: 700.0
    unit: nm
    note: 기준 조건(Δ=1.0)의 기준점 — abrasive_d99_nm과 동일값으로 이중계상 방지
    source: knowledge/cmp/abrasive-d99-scratch-hitachi-us8439995.md §2.2
    confidence: estimated
  damage_exponent:
    value: 1.44
    unit: "-"
    note: >
      US8439995B2 4점 실측 로그-로그 회귀값(n=1.44, R²=0.997) — sim/factors.py
      기본값(3.0, 문헌 근거 없는 가정값)보다 약 2배 완만. 세리아 화학종
      한정(텅스텐/알루미나는 별도 검토 필요, egan-kim2019 n_temp=3.73·
      n_agit=1.73 참조).
    source: knowledge/cmp/abrasive-d99-scratch-hitachi-us8439995.md §3
    confidence: literature

  oxide_nitride_selectivity:
    value: 60.0
    unit: "-"
    note: >
      Hwang 2024 실측 선택비 59~80 범위의 하단. 아미노산/계면활성제 첨가로 제어된다.
      ⚠ 엔진은 아직 이 값을 쓰지 않는다 — nitride 정지층 모델(film-nitride) 미구현.
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: literature

  # ── 화학층 (chemical tooth) ─────────────────────────────
  # 세리아는 물리흡착이 아니라 Si-O-Ce 화학결합으로 실리카를 뜯어낸다.
  # 이게 실리카 슬러리와의 근본적 차이라, 화학 항을 빼면 세리아를 모델링한 게 아니다.
  ce3_fraction:
    value: 0.15
    unit: "-"
    note: >
      표면 Ce3+ 분율. 산소공공 x에 대해 전하균형 f=2x (노트 verify PASS).
      H2O2 0.5wt% 첨가 시 최대가 되며, 이때 oxide MRR이 상용 대비 5.5배로
      보고됐다(Netzband & Dunn 2020). 이 값을 올리면 화학층이 MRR을 올린다.
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: literature
  ce3_fraction_ref:
    value: 0.15
    unit: "-"
    note: 기준 조건(배수 1.0이 되는 지점). 여기서 Kp가 캘리브레이션돼 있다고 본다
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: estimated
  ceria_tooth_gain:
    value: 1.0
    unit: "-"
    note: >
      ⚠ Ce3+ 분율 → MRR 배수의 기울기. Netzband의 5.5배는 Ce3+ 외 다른 변수도
      함께 움직인 결과라 그대로 쓸 수 없어 보수적으로 1.0(선형)을 놓았다.
      **문헌에 폐형식 함수가 없다 — 이 값이 캘리브레이션 1순위 대상이다.**
    source: knowledge/cmp/ceria-slurry-ce-redox-selectivity.md
    confidence: unverified

  # ── ψ 표면 흡착 보호 (분산제 경로, 교차계 전이) ──────────
  dispersant_type:
    value: "NONE"
    unit: "-"
    note: >
      oxide_silica 팩에서 상속된 경로이다. Li et al. 2021은 실리카 슬러리 실통이라
      세리아(STI/SiC) 화학계로의 전이는 교차계 외삽이다(EVIDENCE-RULES E4) — 세리아 슬러리는
      실제로 EAA 공중합제 분산제를 사용한다는 정직 기록이 slurry-components-overview.md §6에
      있으나 **정량 MRR 저해값은 문헌에 없다.**

      ⚠ 그러므로 기반값은 "NONE"이다. 실리카용 PVA 수치(-3.6%)를 세리아 팩에 그대로
      밗으면 (1) 근거 없는 수치를 도입하고 (2) 이 팩의 kp가 분산제 무관 문헌 MRR에서
      역산됐으므로 기준 조건에서 ψ≠1.0이 되어 이중 계상한다(2026-09-11 사고).
      confidence는 estimated를 유지해 "세리아에서는 이 경로가 정량화되지 않았다"는
      사실을 코드에 남긴다. 세리아 전용 저해 실제가 나오면 그것으로 교체한다.
    source: knowledge/cmp/abrasive-size-concentration-ph-K-additive-mrr-quantitative.md §6 (교차계 — 정량값 미전이)
    confidence: estimated

  # -- tau slurry transport (viscosity) ------------------------
  slurry_viscosity_pa_s:
    value: 1.4e-3
    unit: "Pa·s"
    note: >
      세리아 CMP 슬러리 **실제** 점도. Kim et al. 2024 (Polymers 16(24) 3593,
      DOI 10.3390/polym16243593) §3.3 Fig.17d: 상용 세리아 슬러리 초기 실제 **1.41 cP**
      (25°C, Brookfield cone/plate; 3개월 보관 후 1.16 cP로 감소).
      교차확인: 동일 그룹 Kim 2024 (Polymers 16(6) 844, DOI 10.3390/polym16060844)
      Table 3 세리아+SMA-1000 분산제 1.34~1.35 cP, Table 4 세리아+소포제 1.31~1.33 cP,
      자제제조 세리아(D5/D6/D7) 1.62/1.47/1.44 cP. 실제 대역 1.31e-3~1.62e-3 중
      **상용품 값**을 대표로 추출. 콜로이달 실리카계(1.0e-3)보다 1.40배 높다 —
      그러므로 base 공통이 아니라 팩별로 나눈다.
      원문이 상용 세리아 분산제를 "Newtonian behavior"로 명시 → 단일 스칼라 정당.
    source: knowledge/materials/slurry-viscosity-rheology-literature-values.md §2
    confidence: literature
