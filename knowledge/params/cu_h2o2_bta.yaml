# 구리 CMP — 산화제(H2O2) + 억제제(BTA) 화학이 지배. 산화막과 메커니즘이 근본적으로 다르다.
#
# 이 팩이 존재하는 이유가 곧 이 설계의 목적이다: 같은 엔진에 이 파일만 물리면
# Cu 시뮬레이션이 된다. 코드는 한 줄도 안 고친다.
base: base
description: "Cu CMP: H2O2 산화 + BTA 패시베이션, dishing 지배 공정"

params:
  film:
    value: cu
    confidence: verified
  abrasive:
    value: alumina
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature

  kp_m_per_pa:
    value: 3.5e-13
    unit: m^2/N
    note: >
      ⚠ Cu는 산화막보다 MRR이 크다(연질 금속 + 화학적 산화층 제거).
      이 값은 문헌 MRR 범위(400~800 nm/min @ 2~3psi)에서 역산한 대표값이며
      우리가 재현 검증하지 않았다. 실데이터 캘리브레이션(M3) 전까지 절대값을 신뢰하지 마라.
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: estimated

  slurry_ph:
    value: 4.0
    unit: pH
    note: 산성 — Pourbaix상 Cu 용해/부동태 경계 제어
    source: knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md
    confidence: literature
  oxidizer:
    value: H2O2
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature
  oxidizer_wt_pct:
    value: 3.0
    unit: "wt%"
    note: 이번 런의 H2O2 농도. 이 값을 바꾸면 화학층이 MRR을 바꾼다
    source: knowledge/cmp/slurry-components-overview.md
    confidence: verified
  oxidizer_ref_wt_pct:
    value: 3.0
    unit: "wt%"
    note: >
      기준 농도 — 화학 배수가 1.0이 되는 지점. Kp가 이 조성의 문헌 MRR에서
      역산됐으므로 반드시 명시해야 한다. 없으면 로더가 '현재 농도'로 폴백해
      항상 자기 자신과 비교하게 되고 배수가 영원히 1.0이 된다(2026-09-06 실제 발생:
      산화제 민감도가 '미모델링'으로 오진됐다).
    source: knowledge/cmp/slurry-components-overview.md
    confidence: verified
  oxidizer_peak_wt_pct:
    value: 3.0
    unit: "wt%"
    note: >
      Kaufman 경쟁모델의 MRR 정점 농도. 착화제 유무로 1%→3% 이동이 확인됨.
      화학층은 이 정점 대비 손실을 계산한다(정점에서 배수 1.0).
    source: knowledge/cmp/slurry-components-overview.md
    confidence: verified
  oxidizer_curve_n:
    value: 2.0
    unit: "-"
    note: >
      단봉 곡선의 정점 이후 감소 완만도. 현상론 형상 파라미터, 미검증.
      [식별성 판정 2026-09-14, EVIDENCE-RULES 판정#19] unverified 유지 — 근거를 못 찾아서가
      아니라 현 데이터로 식별 불가능하기 때문이다. 이 팩은 C = oxidizer_ref_wt_pct =
      oxidizer_peak_wt_pct = 3.0 wt% 라서 산화제 항의 분자·분모가 항등적으로 같고, n 값과
      무관하게 배수가 정확히 1.0 이다(기준 운전점에서 n은 결과에 전혀 영향이 없다).
      n은 농도를 바꾸는 what-if 스캔에서만 살아난다 — C=1 wt%에서 n=1 vs n=6 예측차 35.5%,
      C=2 wt%에서 5.6%. 따라서 그 스캔 결과는 순위만 신뢰하고 크기는 신뢰하지 말 것.
      C_peak=3.0은 Aksu 2003(Electrochimica Acta, 정점 1~3%, >3% 부동태화)이 독립 확증하나
      같은 문헌이 n에는 어떤 제약도 주지 않는다.
      상세: knowledge/cmp/chi-oxidizer-curve-exponent-identifiability.md
    source: knowledge/cmp/slurry-components-overview.md
    confidence: unverified
  oxidizer_passivation_K:
    value: 0.8232
    unit: "1/wt%"
    note: >
      Langmuir 부동태 피복 상수. theta(C)=K*C/(1+K*C) 이고 산화제 항은
      f(C) = phi + (1-phi)*(1-theta(C))/(1-theta(C_ref)) 로, 산화제가 많을수록
      Cu 표면 부동태막이 활성 사이트를 덮어 제거율이 낮아지는 방향이다.
      [EVIDENCE-RULES 판정#20, 2026-09-14] 이 키가 존재하면 레거시 단봉 경로
      (oxidizer_curve_n + oxidizer_peak_wt_pct)는 비활성이다 — 아래 두 키는
      삭제하지 않고 하위호환용으로만 남긴다(w_fe_oxidizer 선례와 동일).

      왜 바꿨나: 레거시 경로는 0->1 wt% 구간에서 배수 +409% 증가를 예측하는데,
      대상계 통제 실측(US20110165777A1 TABLE 2, KOH 0.41wt%/FSN 500ppm 고정,
      산화제만 스윕: 0/0.25/0.5/1.0 wt% -> 18.7/14.0/12.9/12.1 nm/min)은 -35%
      감소다. 정량 편차가 아니라 **부호가 반대인 정성적 반증**이다.
      메커니즘 방향은 Ein-Eli/Abelev/Starosvetsky 2004 Electrochimica Acta 49,
      1499-1503 (DOI 10.1016/j.electacta.2003.11.010) 도입부가 뒷받침한다
      (고농도 H2O2 -> Cu passivation -> 용해/제거율 감소).

      값의 출처: 위 TABLE 2 4점에 phi=0.15 고정하고 K 1개만 최소자승 적합
      (격자탐색 최적 K=0.8232, 잔차 최대 11.9%). SSE(K)가 최적값에서 뾰족한
      단일최소를 가져 식별 가능하다(0.3K/3K 에서 잔차 5배 이상 악화) — 판정#19의
      (n, C_peak) 완전축퇴와 질적으로 다르다.
      ⚠ confidence=estimated: 방향은 1차 실측+메커니즘 문헌이 뒷받침하지만 값
      자체는 4점 적합이고 문헌이 준 폐형식 상수가 아니다. 부풀리지 않는다.
      ⚠ phi(oxidizer_mech_floor)는 이 팩 미선언(기본 0.15) — K와 동시에 풀면
      약하게 축퇴해 데이터에서 뽑지 않았다(노트 5절).
      상세: knowledge/cmp/chi-oxidizer-cu-h2o2-reparameterization.md
    source: knowledge/cmp/chi-oxidizer-cu-h2o2-reparameterization.md
    confidence: estimated
  inhibitor:
    value: BTA
    source: knowledge/cmp/slurry-components-overview.md
    confidence: literature
  inhibitor_mM:
    value: 1.0
    unit: mM
    note: BTA 농도. Langmuir θ=0.97 → 표면 97% 피복 = 제거 억제
    source: knowledge/cmp/slurry-components-overview.md
    confidence: verified
  inhibitor_dG_ads_kJ:
    value: -35.4
    unit: kJ/mol
    note: >
      BTA 흡착 자유에너지. K=2.9e4 L/mol로 환산되며 노트 verify 블록 PASS.
      물리흡착(-20~-40 kJ/mol) 영역 — 세리아 화학흡착(-111~-258)과 대비된다.
      [등급 판정 2026-09-14, EVIDENCE-RULES 판정#17] verified→estimated 하향.
      사유: 이 값은 **평형(equilibrium)** 흡착 자유에너지인데, `_inhibitor_term`은
      이를 그대로 K_eq로 변환해 CMP **정상상태** θ에 대입한다. Len, McNeill & Gamble
      2000(MRS Proc. 613, E7.4.1, DOI:10.1557/proc-613-e7.4.1, 원문 PDF 확보)의 BTA
      0.1/0.25 wt.% 제거율 실측(65/42 nm/min, 비=0.6462)으로 이 경로를 시험하면,
      현 K_eq=28676 L/mol에서는 두 농도 모두 θ가 이미 0.996/0.998로 포화해 모델
      예측비가 0.9926(사실상 무변화)로 나와 34.6pp 어긋난다 — 정량 반증.
      물리적 원인: 패드·연마입자가 Cu-BTA 막을 형성 속도와 경쟁하며 기계적으로
      벗겨내므로(원문: "abrasives... try to mechanically abrade away this monolayer
      as soon as it forms") 유효 K_eff는 K_eq보다 작아야 한다(역산 시 K_eff~183~250
      L/mol, K_eq/K_eff~115~157). 단 이 값(-35.4)이 **평형값으로서 틀렸다는 뜻은
      아니다** — "이 값을 이 경로(정상상태 θ)에 직접 쓰는 것"이 반증됐을 뿐이다.
      계가 다른(알칼리+알루미나) [A]의 K_eff는 산성 H₂O₂+BTA 팩에 이식하지 않는다
      (E3, 계 불일치). 산성계 K_eff 직접 실측은 미확보 — 다음 과제.
      상세: knowledge/cmp/bta-inhibitor-langmuir-K-effective-cu-cmp-falsification.md
    source: knowledge/cmp/bta-inhibitor-langmuir-K-effective-cu-cmp-falsification.md
    confidence: estimated
  inhibitor_ref_mM:
    value: 1.0
    unit: mM
    note: >
      기준 농도. 여기서 화학 배수가 정확히 1.0이 되어 Kp가 그대로 쓰인다(이중계상 방지).
      [등급 판정 2026-09-14, EVIDENCE-RULES 판정#24] verified→estimated 하향. 사유:
      이 노트는 원래 "Kp가 이 조성(1.0mM BTA)의 문헌 MRR에서 역산됐다"고 근거를 댔으나
      감사 결과 `kp_m_per_pa`의 실제 출처(knowledge/cmp/surface-chemistry-cu-w-pourbaix-passivation.md)는
      BTA 농도와 무관한 **일반 문헌 MRR 범위**(400~800 nm/min @ 2~3psi)의 대표값이지, 1.0mM
      BTA 조성에서 역산된 값이 아니다 — "같은 조성에서 역산했다"는 근거 자체가 성립하지 않는다.
      기준점 선택(ref_mM=inhibitor_mM)은 이중계상을 막는 **정의**로서는 여전히 옳지만(코드로
      항등 확인 가능), "이 특정 값이 Kp 계산과 조성 일치를 이룬다"는 근거는 없다 — w_fe_oxidizer의
      동일 성격 파라미터(estimated)와 등급을 맞춘다.
      상세: knowledge/cmp/psi-inhibitor-strength-k-grade-ruling.md §A.4
    source: knowledge/cmp/slurry-components-overview.md
    confidence: estimated
  inhibitor_strength_k:
    value: 3.0
    unit: "-"
    note: >
      ⚠ 억제 강도 형상 파라미터. 잔여율 = exp(-k·θ).
      (1-θ)를 쓰면 θ가 0.97에서 포화돼 2mM과 5mM이 구분되지 않는다(실제 발생).
      실제 억제는 피복률뿐 아니라 막 치밀도·재생속도에도 달려 고농도에서도 계속 세진다.
      **문헌 폐형식 없음 — 캘리브레이션 1순위.** 순위는 보존되나 절대값은 신뢰 불가.
      [2026-09-14, EVIDENCE-RULES 판정#17] Len/McNeill/Gamble 2000(MRS Proc. 613,
      E7.4.1) 실측으로 이 팩의 억제항 전체(K·k)를 시험한 결과, 약한 고리는 **k가
      아니라 K**로 판명됐다 — k=3.0을 고정한 채 K만 183 L/mol로 낮춰도 0.1 wt%
      점을 정확히, 0.25 wt% 점을 −11.9% 오차로 재현한다(2점 동시 피팅해도
      k=2.684로 3.0에서 크게 벗어나지 않음). 그러므로 이번 판정에서 k=3.0 값은
      **건드리지 않는다** — 손댈 근거가 없다. 다만 두 역산해 모두 0.5/0.75 wt%
      플래토(관측 ~42 nm/min 고정)를 재현하지 못한다(계속 감소를 예측) — Langmuir+
      exp(-k*theta) 함수형 자체에 기계적 하한(mechanical floor)이 없다는 구조적
      한계로 기록한다(코드 미변경).
      상세: knowledge/cmp/bta-inhibitor-langmuir-K-effective-cu-cmp-falsification.md
    source: knowledge/cmp/bta-inhibitor-langmuir-K-effective-cu-cmp-falsification.md
    confidence: unverified
  abrasive_size_nm:
    value: 100.0
    unit: nm
    note: >
      Cu+알루미나+H2O2+BTA를 정확히 동시에 다루는 1차 문헌(Gopal & Talbot 2007, JES 154(6)
      H507, doi:10.1149/1.2718474 — 원문 PDF 직접 확보·판독)에서 EKC Technology 알루미나
      공칭 입경 100 nm(Ihnfeldt & Talbot 2006, JES 153(11) G948, doi:10.1149/1.2335982
      원문에서 확인) / 수용액 중 측정 유효 평균 입경 120 nm(Gopal 2007 원문)를 확인,
      해당 EKC Tech 알루미나가 0.01wt% BTA + 0.1wt% H2O2 조합으로 Luo-Dornfeld MRR 모델에
      직접 쓰였다. 기존 100 nm 값이 이 공칭값과 정확히 일치해 값은 유지한다.
      대조: Rodel 알루미나(Seal et al., 인용 통한 2차 확인) mean diameter 170 nm은
      H2O2+glycine 조합(BTA 없음)이라 정확 일치가 아니므로 채택하지 않음.
      저응집 조건 대표값 — pH·첨가제에 따라 이봉 응집으로 수백nm~수μm까지 벌어질 수 있음.
    source: knowledge/cmp/abrasive-size-d50-ekc-alumina-cu-h2o2-bta-gopal-ihnfeldt-talbot.md
    confidence: literature
  abrasive_size_exponent:
    value: 0.0
    unit: "-"
    note: >
      **검증된 영(null) 결과 — "모름"이 아니라 "효과 없음"이다.**
      EVIDENCE-RULES.md 판정 #1 (2026-09-11)로 확정. 5회차 순환하던 RESPONSE_DEAD를 종결한다.

      충돌: Bai 2007(Appl.Surf.Sci. 253, 8489) 폐형식 유도는 D^-1.5 단조감소를 주장하나
      (E4 — oxide에서 검증된 것을 Cu로 전이, 막질 전이 자체가 미검증),
      TW202115224A 실측 n=18은 반대로 대체로 증가하는 밸리형이다
      (E3 — 15~50nm 구형 / 125~160nm 응집체·누에고치형이라 입경과 형상이 함께 변함, 교란 미분리).

      판정: 양측 다 단독 채택 불가 → 교란을 걷어낸 부분집합으로 재검정.
      순수 구형만(15/27/50/160nm, n=6/압력) 골라 Spearman을 돌리면 rho≈0.03~0.15로 비유의.
      독립 이론(Chen thesis, Iowa State, Ch.4 단층 입자밀도 Eq.4.2.14-18)도
      면밀도 d^-2 x 압입 d^+2 가 상쇄되어 d^0(무반응)를 지지한다.

      결론: **cu_h2o2_bta 계에서 입경은 MRR의 지배인자가 아니다.**
      지수 0.0은 지어낸 값이 아니라 두 독립 경로(교란 제거 실측 + 1차 이론)가 합의한 값이다.
      적용 범위: 15~160nm, 구형 콜로이달 실리카, 글리신/알라닌/트리아졸 Cu 화학.
      이 범위 밖이나 응집체 비율이 높은 슬러리에는 형상 팩터가 따로 필요하다(미구현).
      ⚠ oxide_silica에 전용 금지 — 그쪽은 Li2021 정점형(80nm 최대)이라 레짐이 다르다.
    source: knowledge/cmp/abrasive-size-null-result-force-partition-theory.md
    confidence: literature

  # ── Δ 손상 유발도 (스크래치 위험) — 진단 전용, MRR에 곱해지지 않음 ──
  abrasive_d99_nm:
    value: 500.0
    unit: nm
    note: >
      abrasive_size_nm(100 nm) × D99/D50 비율 5.00. 옛 근거(Silco/Levitronix 2008 산업
      컨퍼런스 슬라이드, 화학종 무관 일반비)는 세리아 실측(Hitachi)으로 재현 안 됨이
      확인돼 2026-09-14 EVIDENCE-RULES 판정#16으로 estimated 강등됐었다.
      [등급 판정 2026-09-14, 재승격] estimated→literature. 새 근거: US7344988B2(DuPont
      Air Products Nanomaterials LLC, "Alumina abrasive for chemical mechanical
      polishing") — 이 팩과 화학종(알루미나)·용도(Cu/Al/W CMP, "especially preferred
      for … copper and/or tungsten")가 **정확히 일치**하는 1차 특허. Horiba LA910 실측
      기반 명세: post-milled D99.9는 "more preferably less than **5 times**" D50 —
      이 팩의 비율(500/100=5.00)과 정확히 일치한다(우연이 아니라 알루미나 CMP 업계
      공통 스펙임을 시사). 값은 바꾸지 않는다(항등적으로 동일 계산) — 근거의 출처만
      "화학종 무관 2차 슬라이드"에서 "알루미나 CMP 전용 1차 특허 상한 스펙"으로
      교체됐다. ⚠ D99.9(99.9백분위)를 D99 상한으로 쓴 근사(D99≤D99.9, 안전한 방향)이며
      단일 실측 로트가 아니라 설계 스펙 범위(preferably 7x/more preferably 5x/example 3x)
      — sti_ceria의 Hitachi 단일실측(E2)과 약간 다른 근거 형태이나 화학종+용도 일치는
      동일 기준으로 literature 등급을 준다.
      Showa Denko US6770218B2 "maximum grain size 0.5 µm" 독립 상한 대조도 유지(정합적).
      상세: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §2, §4.1, §5.
    source: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §2, §4.1, knowledge/cmp/delta-scratch-damage-d99-oversize-particle-model.md §4.2
    confidence: literature
  abrasive_ref_d99_nm:
    value: 500.0
    unit: nm
    note: >
      기준 조건(Δ=1.0)의 기준점 — abrasive_d99_nm과 동일값으로 이중 계상 방지.
      [2026-09-14 재승격] abrasive_d99_nm과 동일 사유로 confidence를 literature로
      맞춘다(knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §4.1).
    source: knowledge/cmp/abrasive-particle-size-distribution-d99-tail.md §4.1
    confidence: literature
  damage_exponent:
    value: 2.54
    unit: "-"
    note: >
      Egan & Kim 2019(ECS JSS 8(5) P3206, GLOBALFOUNDRIES 300mm 양산) 두 관측
      n_temp=3.73 / n_agit=1.73의 기하평균(로그축 중앙). ⚠ 원 관측은 **텅스텐** 벌크 CMP다 —
      Cu로의 전이는 연마입자·촉매 계열 유사성(Showa Denko US6770218이 W Ex.1과 Cu Ex.9를
      동일 알루미나+질산철 슬러리로 다룸)에만 기댄다. Cu 막질에서 직접 측정된
      D99-스크래치 대응쌍은 확인하지 못했다 → confidence를 estimated로 강등.
    source: knowledge/cmp/delta-scratch-damage-d99-oversize-particle-model.md §4.3
    confidence: estimated

  # Cu 고유 — 패턴 웨이퍼 dishing
  dishing_sensitivity:
    value: 1.0
    unit: "-"
    note: >
      ⚠ 미연결. dishing 정량에는 금속:산화막 MRR 비가 필요한데
      아직 두 팩을 동시에 로드하는 다막질 모델이 없다(film-cu 에이전트 대기).
    source: knowledge/cmp/pattern-dependent-dishing-erosion.md
    confidence: unverified

  film_bulk_hardness_pa:
    value: 1.2e+09
    unit: Pa
    note: >
      전해도금 구리막의 나노압입 경도. 산화막보다 한 자릿수 무르다 — 같은 접촉응력에서도 소성 쪽으로 더 가깝다는 뜻이다.
      ⚠ 이것은 **벌크** 경도이지 CMP 가 실제로 깎는 화학 변질층의 경도가 아니다.
      변질층 경도의 절대값은 공개 문헌에 없다(_knowledge_audit/mechanics.md 의
      최대 병목). 다만 변질층은 벌크보다 무르므로 H_surface ≤ H_bulk 이고,
      이 부등식이 한쪽 방향의 판정을 확정해 준다 — 접촉응력이 벌크 경도를
      넘으면 변질층에서는 더더욱 소성이다. 그 용도로만 쓴다
      (sim/regime_adapter.py::alpha_from_bulk_bound).
    source: "Nanoindentation of electroplated Cu films — 결정립 크기에 따라 1.0~1.5 GPa"
    confidence: literature
