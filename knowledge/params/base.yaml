# 공통 베이스 — 장비·패드·접촉역학. 막질/슬러리와 무관한 것만 여기 둔다.
#
# 이 파일이 존재하는 이유: 이 값들은 원래 sim/tier2_physics/*.py 에 하드코딩돼 있었다
# (_E_STAR=1e9, _R=5e-6, _BETA=1/0.3e-6, _ETA=1e11 ...). 코드를 고쳐야만 다른 조건을
# 돌릴 수 있었다는 뜻이다. 이제 팩을 바꾸면 된다.
#
# confidence 표기:
#   verified   — 코드로 재현·검증 완료 (지식노트 verify 블록 PASS)
#   literature — 논문/표준 인용값, 우리가 재현하진 않음
#   estimated  — 문헌 범위에서 고른 대표값. 실제 툴마다 다르다
#   unverified — 출처 불충분. 결과에 경고로 딸려 나간다

description: "공통 베이스 — 300mm 로터리 CMP 툴, IC1000류 PU 패드, 산화막 기준"

params:
  # ── 웨이퍼/툴 기하 ──────────────────────────────────────
  wafer_radius_m:
    value: 0.150
    unit: m
    source: SEMI M1 (300mm 표준)
    confidence: literature
  center_offset_m:
    value: 0.180
    unit: m
    note: r_cc 웨이퍼중심-플래튼중심 거리. 툴마다 다름
    source: knowledge/physics/cmp-kinematics-rotary.md
    confidence: estimated

  # ── 패드 표면 통계 (GW 접촉역학) ────────────────────────
  # 원래 위치: sim/tier2_physics/gw_preston_link.py 의 _E_STAR/_R/_BETA/_ETA/_A_N
  pad_E_star_pa:
    value: 1.0e9
    unit: Pa
    note: 등가 탄성계수 E*. PU 패드 ~1 GPa 오더
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated
  pad_asperity_radius_m:
    value: 5.0e-6
    unit: m
    note: asperity 곡률반경 R
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated
  pad_height_beta_inv_m:
    value: 0.3e-6
    unit: m
    note: asperity 높이 지수분포 스케일 1/beta (= 표면조도 척도)
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated
  pad_asperity_density_m2:
    value: 1.0e11
    unit: 1/m^2
    note: 단위면적당 asperity 수 eta
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated
  pad_nominal_area_m2:
    value: 1.0e-4
    unit: m^2
    note: 명목 접촉면적 A_n (1 cm^2 기준 셀)
    source: knowledge/materials/gw-nominal-vs-local-pressure.md
    confidence: literature

  # ── 패드 마모/컨디셔닝 ──────────────────────────────────
  # 원래 위치: conditioner_pcr_decay.py / conditioner_asperity_distribution.py
  pad_pcr_anchor_hours:
    value: 50.0
    unit: h
    source: Entegris 기술자료 (PCR 감쇠 앵커점)
    confidence: literature
  pad_pcr_anchor_ratio:
    value: 0.16
    unit: "-"
    note: 50h 후 PCR/PCR0
    source: Entegris 기술자료
    confidence: literature
  pad_sigma0_m:
    value: 8.112e-6
    unit: m
    note: 초기 asperity 높이 표준편차. Lv3-1 노트 Table1 실측
    source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
    confidence: literature
  pad_wear_half_life_h:
    value: 48.0
    unit: h
    source: knowledge/materials/pad-wear-glazing-mrr-decay.md
    confidence: estimated

  # ── 윤활/마찰 (Stribeck) ────────────────────────────────
  # 원래 위치: cmp_lubrication_regime.py 의 cof_stribeck 기본인자
  cof_boundary:
    value: 0.30
    unit: "-"
    note: 경계윤활 영역 마찰계수 mu_bl
    source: knowledge/physics/tribology-friction-wear-stribeck.md
    confidence: literature
  cof_hydro_coeff:
    value: 8.0
    unit: "-"
    source: knowledge/physics/cmp-lubrication-regimes.md
    confidence: estimated
  cof_transition_alpha:
    value: 40.0
    unit: "-"
    source: knowledge/physics/cmp-lubrication-regimes.md
    confidence: estimated

  # ── 공정 기본 조건 ──────────────────────────────────────
  pressure_psi:
    value: 3.0
    unit: psi
    note: 대표 다운포스. 20.7 kPa
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  rpm_wafer:
    value: 60.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  rpm_platen:
    value: 55.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  relative_velocity_ref_mps:
    value: 0.75
    unit: m/s
    note: 0.5~1 m/s 대표값
    source: knowledge/physics/cmp-kinematics-rotary.md
    confidence: literature

  # ── 계측 ────────────────────────────────────────────────
  n_points:
    value: 81
    unit: "-"
    note: 웨이퍼 전체 81포인트 측정 (사용자 실무 기준)
    source: knowledge/cmp/uniformity-metrics-definitions-standards.md
    confidence: verified
  edge_exclusion_m:
    value: 0.003
    unit: m
    source: knowledge/cmp/wafer-metrology-thickness-methods.md
    confidence: literature

  # ══════════════════════════════════════════════════════════
  # 병합 파라미터 기준점 (ARCHITECTURE-V2.md §2 · sim/factors.py)
  #
  # ⚠ 왜 '_ref' 값이 반드시 필요한가:
  #   모든 팩터는 **기준 조건 대비 배수**여야 한다. Kp가 이미 특정 조성·조건에서
  #   역산된 값이므로, 팩터를 절대값으로 곱하면 같은 효과를 두 번 센다
  #   (2026-09-06 Cu MRR 20배 붕괴가 정확히 이 사고였다).
  #   기준값이 없으면 factors.py는 '기준=현재값'으로 폴백하는데, 그러면 배수가
  #   영원히 1.0이라 **인자를 바꿔도 결과가 안 변한다.** 그래서 여기 명시한다.
  # ══════════════════════════════════════════════════════════

  # ── Λ 기계 부하 강도 기준 ────────────────────────────────
  lambda_ref_pressure_psi:
    value: 3.0
    unit: psi
    note: 위 pressure_psi와 같은 기준 조건. Kp가 이 근방에서 역산됐다
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  lambda_ref_rpm_platen:
    value: 55.0
    unit: rpm
    source: knowledge/cmp/cmp-tool-architecture.md
    confidence: literature
  lambda_ref_center_offset_m:
    value: 0.180
    unit: m
    source: knowledge/physics/cmp-kinematics-rotary.md
    confidence: estimated

  # ── Θ 열·유동 부하 (SFR) ────────────────────────────────
  sfr_ml_min:
    value: 150.0
    unit: mL/min
    note: >
      ILD 레시피 실측 조건. Yim 2018은 200, Cu 3-step은 조건별 상이.
      실제 툴에서 가장 자주 만지는 손잡이 중 하나다.
    source: knowledge/cmp/product-wafer-proxy-metrics-virtual-metrology.md
    confidence: literature
  sfr_ref_ml_min:
    value: 150.0
    unit: mL/min
    note: Θ 기준점 — sfr_ml_min과 같은 조건
    source: knowledge/cmp/product-wafer-proxy-metrics-virtual-metrology.md
    confidence: literature

  # ── Γ 컨디셔닝 부하 ─────────────────────────────────────
  cond_downforce_lbf:
    value: 4.0
    unit: lbf
    note: ≈17.8 N. PCR 실험 표준 조건 (패드 100 RPM, 디스크 73 RPM)
    source: knowledge/equipment/disk-rpm-load-radius-pcr.md
    confidence: literature
  cond_ref_downforce_lbf:
    value: 4.0
    unit: lbf
    source: knowledge/equipment/disk-rpm-load-radius-pcr.md
    confidence: literature
  cond_sweep_cpm:
    value: 10.0
    unit: cpm
    note: >
      ⚠ 스윕 왕복수의 구체 수치가 확보된 노트에 없다. conditioner-sweep-kinematics
      노트는 하중·RPM만 표로 제시한다. 10 cpm은 상용 툴 범위의 대표값 추정이다.
    source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
    confidence: unverified
  cond_ref_sweep_cpm:
    value: 10.0
    unit: cpm
    source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
    confidence: unverified
  cond_duty_pct:
    value: 100.0
    unit: "%"
    note: in-situ 연속 컨디셔닝 = 100%. ex-situ면 낮아진다
    source: knowledge/equipment/disk-insitu-exsitu-conditioning-mrr-stability.md
    confidence: literature
  cond_ref_duty_pct:
    value: 100.0
    unit: "%"
    source: knowledge/equipment/disk-insitu-exsitu-conditioning-mrr-stability.md
    confidence: literature

  # ── κ 접촉 강도 (패드·디스크 몫) ─────────────────────────
  pad_hardness_shore_d:
    value: 60.0
    unit: Shore D
    note: >
      IC1000/IC1010 실측. 둘은 같은 경도(Shore D 60)이고 두께만 다르다(50 vs 80 mils).
      ⚠ Shore C 90과 직접 비교 금지 — 스케일이 다르다(노트 §1 명시).
    source: knowledge/materials/pad-hardness-porosity-measurement-methods.md
    confidence: verified
  pad_ref_hardness_shore_d:
    value: 60.0
    unit: Shore D
    note: κ 기준점 — IC1000 표준 경질 패드
    source: knowledge/materials/pad-hardness-porosity-measurement-methods.md
    confidence: verified
  asperity_density_per_m2:
    value: 1.0e11
    unit: 1/m^2
    note: pad_asperity_density_m2와 같은 값 — κ가 읽는 별칭
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated
  asperity_ref_density_per_m2:
    value: 1.0e11
    unit: 1/m^2
    source: knowledge/materials/hertz-gw-contact-mechanics.md
    confidence: estimated

  # ── τ 슬러리 전달 (미연결 — 입력만 존재) ─────────────────
  # ⚠ 이 값들은 팩에 있지만 엔진 물리에 연결돼 있지 않다.
  #   factors.py의 τ가 '입력은 있으나 미연결'로 신고하는 근거다.
  #   조용히 두면 "그루브를 반영했다"는 거짓말이 되므로 명시적으로 둔다.
  groove_depth_mm:
    value: 0.76
    unit: mm
    note: K-groove 계열 전형 깊이 (30 mil)
    source: knowledge/materials/pad-structure-groove-subpad.md
    confidence: literature
  groove_pitch_mm:
    value: 3.05
    unit: mm
    note: 120 mil 피치
    source: knowledge/materials/pad-groove-geometry-contact-area-flow-resistance.md
    confidence: literature
  groove_width_um:
    value: 600.0
    unit: um
    note: >
      Mu 2016 패드 B. 슬러리 이용효율 η이 이 폭 부근에서 최대(13.4% @3PSI)이고
      900 µm로 더 넓히면 오히려 정체·감소한다(12.8%).
    source: knowledge/materials/pad-groove-geometry-contact-area-flow-resistance.md §2
    confidence: literature
  groove_ref_width_um:
    value: 600.0
    unit: um
    note: τ 기준점 — 위와 같은 조건
    source: knowledge/materials/pad-groove-geometry-contact-area-flow-resistance.md §2
    confidence: literature
  pad_porosity_pct:
    value: 35.0
    unit: "%"
    note: >
      IC1000류 캐스트 PU 패드 전형 기공률. Prasad 2013은 15~45% 범위를 실험했다.
    source: knowledge/materials/pad-porosity-slurry-transport-mrr.md
    confidence: estimated
  pad_ref_porosity_pct:
    value: 35.0
    unit: "%"
    note: τ 기준점 — 위와 같은 값
    source: knowledge/materials/pad-porosity-slurry-transport-mrr.md
    confidence: estimated
  tau_mrr_exponent:
    value: 0.07
    unit: "-"
    note: >
      슬러리 전달 → MRR 결합 지수. Prasad 2013 III.D.3에서 역산:
      기공률 15→45%(보유용량 3배)에 평균 RR은 8%만 증가 ⟹ ln(1.08)/ln(3) ≈ 0.07.
      ⚠ "슬러리를 더 나르면 MRR이 비례해 오른다"는 직관은 이 실측으로 기각됐다.
      ⚠ 기공률 실험에서 뽑아 그루브 축에 교차 대입한 값이라 미검증 —
      순위만 신뢰하고 크기는 캘리브레이션 대상이다.
    source: knowledge/materials/pad-porosity-slurry-transport-mrr.md §5
    confidence: unverified
