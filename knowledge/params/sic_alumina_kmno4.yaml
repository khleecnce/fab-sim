# 4H/6H-SiC CMP — 산성 KMnO4 산화제 + 알루미나 연마입자 (고속 레짐)
#
# 왜 이 팩을 분리했나 (2026-09-16, EVIDENCE-RULES 판정#49-B):
#   sic_ceria_h2o2 팩의 Preston 계수를 그 팩의 근거 DOE(Wang ACS SI Table S3,
#   알칼리 세리아/H2O2)에서 역산해 바로잡자, 같은 "SiC CMP"로 묶여 있던
#   US20220315802A1(Entegris/U.Florida) 데이터가 195배 과소예측으로 튀었다.
#   원인은 Kp 가 아니라 **레짐이 다른 데이터를 한 팩에 담아 둔 것**이다:
#     · Wang(알칼리 세리아/H2O2, pH 9~11)  실측 0.12~0.96 um/h
#     · Su 2011(알칼리 알루미나, pH 9)      실측 0.045~0.070 um/h
#     · Entegris(산성 KMnO4/알루미나, pH 2.3) 실측 1.2~5.8 um/h
#   같은 재료(SiC)에서 실측이 130배 벌어진다. 하나의 Kp 로 덮으면 어느 쪽도
#   맞지 않는다 — EVIDENCE-RULES §"그래도 안 갈리면 스코프를 쪼개라"에 해당.
#   KMnO4(E°(MnO4-/MnO2) = +1.68 V vs SHE, 강산성)는 H2O2 보다 훨씬 강한
#   산화제이고, 특허 원문 자체가 Mohs<6(나노 산화물)과 alpha-alumina 계열을
#   별개 거동 레짐으로 명시한다([0043]/[0057], 판정#36에서 이미 확인).
#
# ⚠ 이 팩은 **절대 MRR 을 이 특허 데이터에서 역산**했다. 같은 데이터로
#   절대값을 다시 검증하면 자기 답안지 채점이다 — 순위(rho)만 held-out 으로 본다.
#   (rho 는 Kp 에 불변이므로 이 분리로 순위 검증이 오염되지 않는다.)

base: sic_ceria_h2o2
description: "4H/6H-SiC CMP: 산성 KMnO4 산화제 + 알루미나 연마입자 (고속 레짐)"

params:
  # ── 연마입자 종 선언 (2026-09-18, 판정#59) ─────────────────────
  # 부모(sic_ceria_h2o2)가 'ceria' 를 선언하는데, 이 팩은 여태 그 값을
  # own 없이 상속만 받고 있었다 — 아래 abrasive_density_kg_m3(α-Al2O3 3.95 g/cm3)·
  # description·근거 문헌(US20220315802A1 Table 1, Gong 2024 Materials 17(3) 679
  # Table 1)이 전부 "알루미나"라고 말하는데 sim/factors.py._f_chi 의 분기 판정
  # 키만 세리아였다. 그 결과 (a) 알루미나 슬러리에 세리아 chemical tooth
  # (_ceria_term)가 켜져 있었고 (b) pH 분기가 세리아 IEP 창으로 들어가
  # wafer_iep_ph 부재로 skip → pH 축이 죽었다(knowledge/cmp/sic-alumina-pack-
  # abrasive-identity-inheritance-defect.md). 부모의 ceria 를 덮는다 —
  # 연마입자가 다르다(abrasive_density_kg_m3 키의 note 와 같은 형식).
  abrasive:
    value: alumina
    note: 부모의 ceria 를 덮는다 — 연마입자가 다르다.
    source: "US20220315802A1 Table 1 (alpha-alumina); Gong et al. 2024, DOI 10.3390/ma17030679 Table 1 (Al2O3 500 nm)"
    confidence: literature

  kp_m_per_pa:
    value: 4.9872e-15
    unit: m^2/N
    note: >
      기준 조건 역산. **어느 문헌을 기준으로 삼을지가 이 파라미터의 핵심 판정이다.**
      산성 KMnO4/알루미나 SiC 계의 절대 MRR 은 문헌마다 크게 갈린다:
        · Wang W. et al. 2021 (ECS J. Solid State Sci. Technol. 10, 074004,
          DOI 10.1149/2162-8777/ac12de) — 4H-SiC Si면, Al2O3 + KMnO4, pH 2,
          6 psi, 90 rpm → **1.4 um/h (= 23.333 nm/min)**
        · Chen G. et al. 2015 (Appl. Surf. Sci. 359, 664-668,
          DOI 10.1016/j.apsusc.2015.10.158) — 6H-SiC Si면, CeO2 + KMnO4, pH 2,
          4 psi, 90 rpm → **1.089 um/h** (연마입자는 세리아지만 같은 산화제·pH)
        · US20220315802A1 Table 1 — 1 psi, 60 rpm → **1.2~5.8 um/h**
      Preston(P x V)으로 환산하면 특허 쪽이 논문 2편보다 약 29배 높다. 특허의
      실시예 수치는 검증 없이 인쇄되고 낙관적인 경우가 많아, EVIDENCE-RULES
      서열(같은 E3 등급이면 재현가능성·독립 확인 수로 깬다)에 따라 **서로
      독립적으로 일치하는 논문 2편** 쪽을 기준으로 채택한다.
      Kp 는 Wang 2021 조건(6 psi, 90/90 rpm, pH 2)을 엔진에 넣어 예측이 실측
      23.333 nm/min 과 정확히 일치하도록 풀었다(현재 코드 실행값 675.04 nm/min
      기준, Kp_old 1.4428e-13 x 23.333/675.04).
      ⚠ **미검증 가정 1건**: Wang 2021 의 알루미나 농도를 리뷰(DOI
      10.3390/mi13101752 §2, 원문 2차 인용)가 적지 않아, 이 팩의 기준 농도
      0.5 wt% 에서 측정됐다고 **가정**해 농도항 배수를 1.0 으로 두었다.
      실제 농도가 다르면 Kp 가 그만큼 틀린다. ECS 원문 확보 시 재계산할 것.
      ⚠ Wang 2021 은 원문 미확보 — 리뷰 경유 2차 인용(E5)이다. 수치 자체는
      리뷰 본문에 인쇄된 값을 그대로 옮겼다.
      결과: 이 Kp 에서 US20220315802A1 데이터셋은 **약 0.035배(29배 과소예측)**
      가 된다. 덮지 않는다 — 그 특허가 다른 문헌 대비 이상치라는 판정의
      직접적 귀결이고, 그 데이터셋은 held-out 으로 남겨 순위(rho=+1.000)만 쓴다.
    source: >
      Wang W., Liu W., Song Z., ECS J. Solid State Sci. Technol. 10 (2021) 074004,
      DOI 10.1149/2162-8777/ac12de (리뷰 DOI 10.3390/mi13101752 §2 경유 2차 인용).
      교차확인: Chen G. et al., DOI 10.1016/j.apsusc.2015.10.158.
    confidence: literature

  abrasive_conc_exponent:
    value: -0.406
    unit: "-"
    note: >
      **판정#52 동반 이동(2026-09-16).** 이 지수는 원래 부모(sic_ceria_h2o2)에
      선언돼 있었으나, 그 근거 데이터인 US20220315802A1 Table 1 은 판정#49-B 로
      이 팩(산성 KMnO4/알루미나)으로 옮겨져 있었다 — 근거와 파라미터가 서로
      다른 팩에 흩어져 있던 상태다. 근거가 있는 이 팩으로 값을 옮긴다.

      값: US20220315802A1 Table 1(Entegris/U.Florida, SiC CMP, 알루미나 나노입자
      0.1~5 wt%, 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3, n=5)의 로그-로그 회귀
      기울기 -0.406. **농도가 오르면 MRR 이 내려간다**(압흔 지배 레짐:
      입자당 하중이 분산되어 압입 깊이가 얕아진다).

      부모와 부호가 반대인 이유(레짐 분리): 부모 팩(알칼리 세리아/H2O2)의 계에서는
      네 건의 관측이 모두 비음(非負)이다(부모 yaml 의 같은 키 note 참조).
      같은 SiC 라도 pH 2.3 강산 KMnO4 · 알루미나(Mohs>6) 계와 pH 9~11 알칼리
      세리아(Mohs~7 이하) 계는 특허 원문 자체가 별개 거동 레짐으로 명시한다
      ([0043]/[0057]). EVIDENCE-RULES §"둘 다 맞되 레짐이 다르다" 에 해당하므로
      두 지수를 평균내지 않고 팩별로 분기한다.

      ⚠ n=5 회귀라 크기 정밀도는 미검증 — 방향(음수)·자릿수(-0.5 근방)만 신뢰.
      ⚠ 이 팩의 유일한 조성 데이터에서 나온 값이다(자기 답안지 주의).
      ⚠ 판정#36·#37 의 검토(같은 특허 Table 9 는 저농도에서 부호 반대)는
      그대로 유효하다 — Table 9 의 관측 구간(0.1~1.0 wt%)이 이 팩의
      기준점 0.5 wt% 를 포함하긴 하나, Table 1 이 더 넓은 구간(0.1~5.0 wt%)을
      덮으므로 Table 1 유지.
    source: knowledge/cmp/sic-alumina-concentration-negative-exponent-entegris.md §3, §5
    confidence: literature

  abrasive_ref_wt_pct:
    value: 0.5
    unit: "wt%"
    note: >
      조성축 기준점 선언(독립 측정값이 아니다). US20220315802A1 Table 1 의
      중간 수준이자, Kp 역산 시 Wang 2021 의 농도로 가정한 값이기도 하다(위 참조).
    source: "US20220315802A1 Table 1 (중간 수준)"
    confidence: measured

  abrasive_wt_pct:
    value: 0.5
    unit: "wt%"
    source: "US20220315802A1 Table 1 — 기준 조성"
    confidence: measured

  ph_ref:
    value: 2.3
    unit: pH
    note: >
      이 팩의 운전 pH(Table 1 전 조건 고정). 부모의 10.0 을 상속하면 기준 조건에서
      화학 pH 항 배수가 1.0 이 아니게 되어 Kp 역산이 이중 계상된다.
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3"
    confidence: measured

  slurry_ph:
    value: 2.3
    unit: pH
    source: "US20220315802A1 Table 1"
    confidence: measured

  ph_softening_ref:
    value: 2.3
    unit: ""
    note: 부모의 pH 연화 기준점(10.0)을 이 팩 운전 pH 로 옮긴다 — 기준 배수 1.0 계약.
    source: "US20220315802A1 Table 1"
    confidence: measured

  # ── 산화제 (2026-09-16, 물리위생 차원 위반 해소) ──────────────
  # 부모(sic_ceria_h2o2)는 H2O2 를 vol% 로 선언한다(Wang DOE: 2/4/6 vol%).
  # 이 팩의 산화제는 KMnO4 이고 특허 원문이 wt% 로 적는다 — 상속하면
  # **다른 재료의 농도를 다른 단위로** 물려받는다(모델 위생 규칙:
  # "재료를 바꾼 팩이 부모의 재료 고유 상수를 물려받으면 남의 재료로
  #  계산한 숫자가 이 팩의 결과로 나온다"). 본값·기준점을 한 편집에서
  # 함께 자기선언한다 — 비(c/c_ref)는 1.0 그대로라 예측은 불변이고,
  # 키 이름(_wt_pct)과 단위(wt%)의 어긋남만 사라진다.
  # ⚠ 현재 이 계보에는 산화제 형상 파라미터(langmuir_K/passivation_K/
  #   peak_wt_pct)가 없어 χ 의 산화제 항 자체가 비활성이다(factors.py 가
  #   경고로 신고 중). 그 항을 켤 때는 KMnO4 기준으로 형상을 새로 확보해야
  #   하며, H2O2 형상을 전용하지 마라(E°가 다르다: MnO4-/MnO2 +1.68 V).
  # ── 산화제 종 선언 (2026-09-16) ────────────────────────────────
  # 부모(sic_ceria_h2o2)가 2026-09-16 에 oxidizer_langmuir_K(H2O2 데이터로 적합)를
  # 선언하면서, 상속만으로 이 팩까지 그 곡선을 쓰게 되는 상황이 생겼다.
  # KMnO4 는 H2O2 와 산화력이 다르다(E°(MnO4⁻/MnO2)=+1.68 V vs SHE) — 형상을
  # 전이하면 남의 산화제로 이 팩의 MRR 을 예측하게 된다. 종을 명시해
  # sim/chemistry.py 의 종 게이트가 그 경로를 끄게 한다. 이 팩의 산화제 형상은
  # KMnO4 데이터를 확보할 때까지 **갭으로 남긴다**(지어내지 않는다).
  oxidizer:
    value: KMnO4
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3"
    confidence: measured

  oxidizer_wt_pct:
    value: 4.0
    unit: "wt%"
    note: >
      이 팩의 기준 조성 산화제 농도 — KMnO4 4 wt%(ph_ref 와 같은 출처 줄).
      부모의 H2O2 3.0 wt% 를 덮는다.
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4 + 0.5 wt% 질산염, pH 2.3"
    confidence: measured

  oxidizer_ref_wt_pct:
    value: 4.0
    unit: "wt%"
    note: >
      기준점 동반 이동(본값과 같은 조성). 부모의 4.0 **vol%**(H2O2)를 덮는다 —
      값이 우연히 같아도 단위와 재료가 다르므로 상속은 오답이다.
    source: "US20220315802A1 Table 1 — 4 wt% KMnO4"
    confidence: measured

  abrasive_density_kg_m3:
    value: 3950.0
    unit: kg/m^3
    note: alpha-Al2O3 3.95 g/cm3 — CRC Handbook. 부모의 세리아 7220 을 덮는다(연마입자가 다르다).
    source: "CRC Handbook of Chemistry and Physics — alpha-Al2O3 density"
    confidence: literature
