# 컨디셔너(다이아몬드 디스크) 구성요소 스키마
#
# 씨앗: 2026-09-06 사용자 지시 — "장비, 패드, disk등 다른 요소들도 이런식으로 구성해줘.
#       어떤 구성이 필요할지는 내가 슬러리 경험밖에 없어서 잘 모르니까 research ai agent
#       통해서 조사해서 만들어." + "내가 말했다고 그게 전체는 아니야. 필요한게 있으면 포함시켜."
#
# 따라서 이 파일은 origin: user 필드가 거의 없다 — 사용자가 지정한 것은 "디스크 계열을
# 만들라"는 것뿐이고, 축의 구성 자체는 문헌 조사 결과다(origin: researched).
# 근거는 전부 knowledge/equipment/conditioner-*.md, diamond-grit-mesh-bonding.md 및
# 그 노트들이 인용한 1차 문헌(3M/Entegris/AMAT 기술문서, 특허, 피어리뷰 논문)에 있다.
#
# ⚠ 회사(동진) 데이터·사내 관행은 일절 반영하지 않았다. 공개 문헌만 사용.

version: 1
component: conditioner
owner: disk-conditioner
description: "CMP 컨디셔너 — 다이아몬드 디스크의 설계(그릿·본딩·기하)와 레시피(하중·스윕·duty)를 실무 지정 단위로 분해."

groups:

  # ═══════════════════════════════ 1) 컨디셔닝 방식
  - id: mode
    label: "컨디셔닝 방식 (in-situ / ex-situ / 대안)"
    origin: researched
    owner: disk-conditioner
    why: >
      "언제 깎느냐"가 먼저다. 웨이퍼 연마와 동시에 깎느냐(in-situ), 사이에 깎느냐(ex-situ)에
      따라 패드 정상상태·MRR·스크래치가 전부 달라진다. 슬러리의 pH처럼 이 계열의 마스터 변수.
    fields:
      - key: method
        label: 컨디셔닝 수단
        type: enum
        options: [diamond_disk, hpmj_water_jet, none]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          다이아몬드 디스크가 양산 표준. 고압 마이크로제트(HPMJ)는 실증된 대안으로,
          MRR 변동이 작고 패드 기공 막힘이 적다는 실측이 있다(Micromachines 14(1) 200, 2023).
          ⚠ HPMJ 실험은 SiC 웨이퍼·비-IC 패드라 IC CMP 일반화는 미검증.
      - key: timing
        label: 시점 (in-situ / ex-situ)
        type: enum
        options: [in_situ, ex_situ, hybrid]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Kwon(2013) 실측 — ex-situ(컨디셔닝 후 DIW 제트 3분 → 연마)가 in-situ보다 스크래치가
          낮으나 MRR도 20 nm/min 낮다. 스크래치와 MRR을 맞바꾸는 축.
      - key: duty_pct
        label: 컨디셔닝 시간 비율 (duty)
        type: number
        unit: "%"
        typical: [0, 100]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          in-situ에서도 전 시간 컨디셔닝하지 않는다. AMAT/3M 실측 레시피는 총 연마 110초 중
          75% 구간만 컨디셔닝. 레시피에서 직접 지정하는 독립 축.
      - key: interval_min
        label: ex-situ 컨디셔닝 주기
        type: number
        unit: min
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          ex-situ/hybrid에서만 의미. HPMJ 실험은 2시간마다 컨디셔닝했고 그 주기가 MRR 변동폭을
          지배했다. ⚠ 양산 다이아몬드 디스크의 표준 주기(매엽/매 N매)는 문헌 미확보.

  # ═══════════════════════════════ 2) 다이아몬드 그릿 규격
  - id: grit
    label: "다이아몬드 그릿 규격 (입도·형상·등급)"
    origin: researched
    owner: disk-design
    why: >
      슬러리의 '입자'에 해당하는 자리. 그릿이 압입자(indenter)이므로 크기·첨예도가 절삭률과
      패드 표면조도를 동시에 결정한다(Evans-Marshall 마모율의 cot(ψ/2)·곡률반경 항).
    fields:
      - key: size_um
        label: 그릿 입경
        type: number
        unit: µm
        typical: [45, 425]
        origin: researched
        maps_to: pad_asperity_radius_m
        status: partial
        confidence: literature
        source: knowledge/equipment/conditioner-grit-design-space.md
        note: >
          3M 설계지도 실측점 45/53/90/125/150/180/250 µm, AMAT-3M DOE는 100~425 µm를 훑었다.
          Ring et al. 근사(패드 asperity 곡률반경 ∝ D_grit)로 pad_asperity_radius_m 과
          연결되나 비례상수는 미확정 — 그래서 partial.
      - key: size_mesh
        label: 그릿 메시 규격
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/diamond-grit-mesh-bonding.md
        note: >
          실무 표기는 µm와 mesh가 섞인다(예 40/50 mesh). US8104464B2는 400 mesh ≈ 34 µm로
          명시하나 업계 통용표는 38 µm — ⚠ 약 10.5% 차이, 정의 차이로 추정되나 미확정.
      - key: grade
        label: 등급 (첨예도)
        type: enum
        options: [sharp, semi_sharp, blocky_leveled]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-design-space.md
        note: >
          동일 입경에서 sharp가 aggressiveness가 높고(Kwon 2013 grade 625 sharp → 절삭율
          약 45 µm/h) 수명 유지력도 좋다(W 슬러리 6h 후 초기 대비 55~65% vs 경쟁 ~15%).
          입경↑ + blockier 보정으로 패드 마모 증가를 상쇄하는 설계 자유도가 있다.
      - key: indenter_angle_psi_deg
        label: 등가 압입각 ψ
        type: number
        unit: deg
        origin: researched
        status: not_wired
        confidence: unverified
        note: >
          ⚠ 조사 필요. Evans-Marshall 마모율이 cot(ψ/2)에 비례하므로 grade를 물리량으로
          바꾸려면 이 값이 필요한데, 3M·Lawing·Entegris 어느 출처에도 정량값이 없다.
          이것이 grade→절삭률 정량 연결을 막는 유일한 결손 파라미터.
      - key: crystal_source
        label: 결정 종류 (천연/합성/CVD)
        type: enum
        options: [natural, synthetic_mono, cvd_coated]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M DOE는 천연·합성 양쪽을 시험했다. CVD 다이아몬드 코팅 디스크(Entegris
          Planargem)는 PCR·Ra가 10~50시간 안정 유지되는 별도 계열.

  # ═══════════════════════════════ 3) 그릿 배열·밀도·돌출
  - id: grit_layout
    label: "그릿 배열 · 밀도 · 돌출 높이"
    origin: researched
    owner: disk-design
    why: >
      같은 그릿이라도 '몇 개를, 어떤 배열로, 얼마나 튀어나오게' 심었는지가 절삭률과 결함을
      가른다. 특히 돌출 높이 분포(균일성)는 평균 절삭률이 아니라 결함 수를 지배한다.
    fields:
      - key: density_count
        label: 그릿 개수 (디스크당)
        type: number
        unit: "count"
        typical: [17000, 60000]
        origin: researched
        maps_to: pad_asperity_density_m2
        status: partial
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Kwon(2013) 실측(10 cm 디스크) — 17k/40k/60k → 패드 절삭율 37/23/19 µm/h.
          밀도가 높을수록 그릿당 접촉압이 낮아져 절삭율이 오히려 떨어진다(비직관적).
          Ring 근사(패드 asperity 밀도 ρ≈1/D_grit²)로 팩 키와 이어지나 비례상수 미확정 → partial.
      - key: pattern
        label: 배열 패턴
        type: enum
        options: [square_array, hexagonal, random, structured_cluster]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          3M E187은 square array. 단 Feng(2007)은 배열 패턴(균일 vs 구조화)이 컨디셔닝 밀도
          분포에 미치는 영향은 **미미**하다고 결론 — 마케팅과 물리가 갈리는 지점.
      - key: pitch_um
        label: 그릿 피치 (간격)
        type: number
        unit: µm
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: "Zheng(2023) 실측 디스크: 평균 피치 430 µm, 그릿 폭 150 µm, 돌출 250 µm (절대 돌출량은 exposure_pct_of_grit 과 함께 봐야 의미가 있다)."
      - key: exposure_pct_of_grit
        label: 돌출 비율 (입경 대비)
        type: number
        unit: "%"
        typical: [5, 150]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/diamond-grit-mesh-bonding.md
        note: >
          실무 표기는 절대값보다 입경 대비 %다. 전착 종래설계는 5~30%(탈락 방지 위해 깊이
          매립 → 슬러리 배출 악화), JP4508514B2 발명은 볼록돌기 구조로 30~150%.
          AMAT-3M DOE는 0~약 60% 범위를 훑었다.
      - key: protrusion_sigma_um
        label: 돌출 높이 분포 폭 (σ)
        type: number
        unit: µm
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-density-protrusion-cutrate.md
        note: >
          평균보다 이 분포 폭이 결함을 지배한다. 3M 사례에서 기준고도 15 µm(실사용 DOP)의
          작동 그릿 비율을 개선하자 Cu 블랭킷 micro-defect가 67~75 → 0~9개로 줄었다.
          슬러리의 '2차 입도'와 같은 자리 — 평균이 아니라 꼬리가 결함을 만든다.
      - key: working_fraction_pct
        label: 작동 그릿 비율
        type: number
        unit: "%"
        origin: researched
        status: not_wired
        confidence: estimated
        source: knowledge/equipment/conditioner-grit-density-protrusion-cutrate.md
        note: >
          실사용 침투깊이(DOP ≈ 15 µm) 기준고도에서 실제로 패드에 닿는 그릿 비율.
          3M Fig.3의 % 수치는 (a)/(b) 대응이 OCR상 뒤섞여 ⚠ 정량값 미확정.
      - key: macro_topography
        label: 매크로 지형 (plateau/valley)
        type: enum
        options: [flat, plateau_valley, none]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M DOE의 설계 변수. plateau·valley 구조는 실효 그릿 밀도를 낮추는 수단으로
          쓰인다(디스크 면 전체가 균일 평면이 아닐 수 있다).

  # ═══════════════════════════════ 4) 본딩 방식
  - id: bonding
    label: "본딩 방식 (그릿을 어떻게 붙였는가)"
    origin: researched
    owner: disk-design
    why: >
      그릿 탈락(pull-out)은 곧 웨이퍼 스크래치이자 디스크 수명 종료다. 본딩 방식이 탈락
      메커니즘·돌출 가능 범위·내식성을 동시에 결정한다.
    fields:
      - key: type
        label: 본딩 종류
        type: enum
        options: [electroplated_ni, brazed, sintered, cvd_coated]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/diamond-grit-mesh-bonding.md
        note: >
          전착 Ni(기계적 파지) / 브레이징(야금학적 결합, NICROBRAZ LM, 1100°C 미만 유지해
          다이아몬드 흑연화 방지) / 소결(3M, 배치·돌출·평탄도 제어) / CVD 코팅(Entegris).
      - key: matrix_material
        label: 매트릭스 재질
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          3M E187은 니켈계 합금 + 패턴 다이아몬드. 슬러리 내식성이 요구 사양이다
          (Ni 매트릭스가 부식되면 그릿이 통째로 빠지고 금속 오염이 된다).
      - key: layer_thickness_um
        label: 본딩층 두께
        type: number
        unit: µm
        typical: [125, 500]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/diamond-grit-mesh-bonding.md
        note: >
          JP4508514B2 전착 실측 3점 — 1 A/dm²·21h→250 µm, 1 A/dm²·10h→125 µm,
          2 A/dm²·21h→500 µm (패러데이 법칙 정합 확인됨).
      - key: retention_strength_mpa
        label: 그릿 파지력
        type: number
        unit: MPa
        origin: researched
        status: not_wired
        confidence: unverified
        note: >
          ⚠ 조사 필요. 브레이징이 전착보다 강하다는 정성 주장만 있고 전단강도 정량 비교는
          두 특허 어디에도 없다(DOI 10.1016/j.diamond.2021.108239 본문 검토 대기).
      - key: corrosion_resistance
        label: 내식성 (슬러리 대응)
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-design-space.md
        note: >
          가속 수명시험에서 W 슬러리 계열이 다이아몬드를 가장 심하게 마모시킨다(정성 순위).
          같은 디스크도 슬러리에 따라 3시간 누적 패드 마모가 계열 내 약 2배 편차.

  # ═══════════════════════════════ 5) 디스크 기하
  - id: disk_geometry
    label: "디스크 기하 (직경·형태·세그먼트·평탄도)"
    origin: researched
    owner: disk-design
    why: >
      디스크 자체의 치수가 패드 반경 방향 마모 균일성(→WIWNU)을 직접 결정한다.
      Feng(2007) 핵심 결론은 디스크반경/패드반경 비가 작을수록 마모 분포가 평탄해진다는 것.
    fields:
      - key: diameter_mm
        label: 디스크 직경
        type: number
        unit: mm
        typical: [100, 360]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          3M E187 상용 규격은 260 mm / 360 mm 두 종. 브레이징 특허 실시예는 100 mm(중심홀
          50 mm) 환형. ⚠ typical 범위는 이 3점에서 잡은 것이라 좁다.
      - key: form
        label: 형태
        type: enum
        options: [full_disk, annular_ring, segmented]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          3M E187은 304SS 캐리어 + Ring 포맷 + Segmented 작업면.
          ⚠ 세그먼트 개수·각도 사양은 TDS에 없어 미확보.
      - key: edge_exclusion_mm
        label: 그릿 제외 영역 (edge exclusion)
        type: number
        unit: mm
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          디스크 가장자리에 그릿을 심지 않는 영역. 3M E187은 세그먼트마다 존재하고,
          AMAT-3M DOE는 이 영역 크기를 설계 변수로 돌렸다. 엣지 그릿이 패드를 파는 것을 막는다.
      - key: flatness_um
        label: 전면 평탄도
        type: number
        unit: µm
        typical: [0, 100]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          3M E187 사양 100 µm 미만. 인과가 문헌에 명시돼 있다 — 디스크 평탄도 불량 → 패드 마모
          불균일 → 웨이퍼(특히 엣지) 상대 제거율 변화 → 패드 수명 동안 WIWNU 드리프트.
      - key: radius_ratio_disk_pad
        label: 디스크/패드 반경비
        type: number
        typical: [0.1, 0.5]
        origin: researched
        status: not_wired
        confidence: verified
        source: knowledge/equipment/conditioner-grit-density-protrusion-cutrate.md
        note: >
          Feng(2007) 결론 — 반경비가 작을수록 컨디셔닝 밀도 분포가 평탄, 클수록 마모 피크가
          패드 중심 쪽으로 이동. 노트 §4에 원-원 교차 기하 독립 재현 코드(CV 0.1~0.2 vs
          0.7~0.9) 있음, 방향성 재현 PASS.

  # ═══════════════════════════════ 6) 하중·회전
  - id: load_kinematics
    label: "하중 · 회전수 (컨디셔닝 접촉 조건)"
    origin: researched
    owner: disk-conditioner
    why: >
      Preston형 PCR = k·P·v 의 P와 v를 직접 지정하는 축. 슬러리에서 pressure/rpm에 해당하는
      자리이나, 웨이퍼 연마 조건과는 별개의 값이다(혼동 주의).
    fields:
      - key: downforce_lbf
        label: 디스크 하중
        type: number
        unit: lbf
        typical: [2, 9]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: >
          Zheng(2023) 4 lbf(≈17.8 N), Entegris 벤치탑 7 lbs, McAllister 실측 0.9~2.7 kgf.
          ⚠ typical 범위는 이 3건에서 잡은 것.
      - key: critical_downforce
        label: 임계 하중 존재
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioning-mechanism-asperity-regeneration.md
        note: >
          Lawing(2004) — 임계 하중이 존재해 그 이하에서는 하중 감소 시 연마율 하락, 이상에서는
          하중을 올려도 연마율 포화. 즉 하중은 단조 레버가 아니다(과잉 컨디셔닝의 물리적 한계).
      - key: disk_rpm
        label: 디스크 자전 속도
        type: number
        unit: rpm
        typical: [30, 120]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: Zheng(2023) 실측 n_d = 73 rpm.
      - key: platen_rpm_during_cond
        label: 컨디셔닝 중 플래튼 속도
        type: number
        unit: rpm
        origin: researched
        maps_to: rpm_platen
        status: partial
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: >
          in-situ면 연마 플래튼 속도와 같으므로 rpm_platen을 그대로 쓴다. ex-situ면 별도
          값이라 팩 키와 어긋난다 — 그래서 partial. Zheng(2023) 실측 n_p = 100 rpm.
      - key: gimbal
        label: 짐벌(gimbal) 유무
        type: enum
        options: [gimbaled, fixed]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          디스크가 스윕 암에 고정인지 자유롭게 기울어지는지. AMAT 스윕 시뮬레이터가 컨디셔너
          짐벌 동작을 별도 경험식으로 반영할 만큼 패드 마모 프로파일에 영향을 준다.

  # ═══════════════════════════════ 7) 스윕 궤적
  - id: sweep
    label: "스윕 궤적 (반경 범위 · 주기 · 체류시간)"
    origin: researched
    owner: disk-conditioner
    why: >
      컨디셔닝 하중은 반경에 균일하게 걸려도 속도와 체류시간은 균일하지 않다.
      따라서 스윕 프로파일이 곧 PCR(r) 프로파일이고, 그것이 패드 형상을 만든다.
      이 계열에서 실무자가 가장 직접적으로 튜닝하는 레버.
    fields:
      - key: sweep_mode
        label: 스윕 모드
        type: enum
        options: [sinusoidal, linear, multi_zone_profiled]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: >
          Zheng(2023)은 사인파 모드를 완전 수식화(Eq.1~9). 실무는 스윕을 여러 구간으로
          나눠 존별 dwell 비율을 지정하는 프로파일 방식을 쓴다.
      - key: sweep_range_mm
        label: 스윕 반경 범위
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: Zheng(2023) 실측 반경 83~308 mm(300 mm 급 플래튼).
      - key: sweep_rpm
        label: 스윕 속도 (왕복 주기)
        type: number
        unit: rpm
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: Zheng(2023) n_a = 19 rpm. McAllister 실측 세팅은 13회/분.
      - key: dwell_profile
        label: 존별 체류시간 프로파일
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          스윕 최적화의 실체. 반경별 (접촉면적 × 선속도 × 체류시간)을 맞춰 접촉 횟수를 균일화한다.
          AMAT 방법론에서 존 공칭면적이 중심→엣지 약 40,000~250,000 mm² 범위.
          ⚠ 구체적 존 분할·dwell 비율 수치표는 전문(유료) 미확보로 미검증.
      - key: pcr_radial_profile
        label: PCR(r) 반경 프로파일
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-sweep-kinematics-pcr-profile.md
        note: >
          스윕의 출력. PCR(r) ∝ 각 반경을 그릿이 지나간 궤적 길이의 총합. Zheng(2023)은
          레이저 공초점현미경 실측과 일치 검증했고, PCR 프로파일이 패드의 기존 표면
          형상과 거의 무관하다는 것도 확인(시간에 따라 재계산할 필요가 없다는 뜻).
      - key: pad_shape_outcome
        label: 결과 패드 형상 (doming/TTV)
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          패드 중간반경 doming → center-fast 제거 → 웨이퍼 프로파일 왜곡. 스윕 리비전으로
          패드 두께 프로파일을 평탄화하면 산화막 제거 프로파일이 평탄·안정해진다(AMAT 실증).

  # ═══════════════════════════════ 8) 절삭률 · 패드 마모 균형
  - id: cut_rate
    label: "절삭률(PCR)과 패드 마모율의 균형"
    origin: researched
    owner: disk-conditioner
    why: >
      이 계열의 존재 이유. 패드 표면은 컨디셔너 절삭(CR)과 웨이퍼 마모(WR)의 균형점에서
      정해진다. CR이 WR보다 작으면 glazing, 크면 패드를 낭비한다.
    fields:
      - key: pad_cut_rate_um_h
        label: 패드 절삭률 (PCR)
        type: number
        unit: µm/h
        typical: [19, 170]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Kwon(2013) 밀도별 19~45 µm/h, JP4508514B2 전착 디스크 130~170 µm/h.
          디스크 사양·하중이 다르므로 이 범위는 넓게 봐야 한다.
      - key: pad_wear_rate_mil_h
        label: 패드 마모율 (실사용)
        type: number
        unit: mil/h
        origin: researched
        maps_to: pad_wear_half_life_h
        status: partial
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M 실측 0.87 / 0.88 mil/hr(플래튼1/2), 연장 런 총 마모 약 23 mils.
          팩의 pad_wear_half_life_h 는 감쇠 시상수라 단위가 달라 직접 대입은 안 된다 → partial.
      - key: aggressiveness
        label: Aggressiveness 값
        type: number
        typical: [55, 90]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          제조사가 카탈로그에 싣는 절삭 능력 지표. 3M E187은 260 mm 70~90, 360 mm 55~75(BL 기준).
          ⚠ 무차원 정의식은 3M·Lawing·Entegris 어느 출처에도 없음 — 이 계열 최대 미해결 항목.
      - key: surface_finish_um
        label: Finish (남기는 패드 조도)
        type: number
        unit: µm
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-design-space.md
        note: >
          3M 설계지도의 두 번째 축. aggressiveness와 짝을 이뤄 디스크 설계공간을 만든다.
          입경이 작을수록 두 값이 함께 낮아진다(Region C).
      - key: cr_wr_balance
        label: CR/WR 균형 상태
        type: enum
        options: [conditioning_dominated, balanced, wafer_dominated_glazing]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioning-mechanism-asperity-regeneration.md
        note: >
          Lawing(2004) 실측 — 저/중/고 공격성에서 패드 추정 접촉면적이 11.3 / 7.7 / 2.2%.
          공격성이 낮을수록 asperity가 뭉툭해져 접촉면적이 오히려 커진다(뾰족한 소수 vs 뭉툭한 다수).

  # ═══════════════════════════════ 9) 패드 표면 결과
  - id: pad_texture_out
    label: "만들어진 패드 표면 (asperity 분포)"
    origin: researched
    owner: disk-conditioner
    why: >
      컨디셔너의 진짜 출력물은 '깎인 두께'가 아니라 '패드 asperity 높이 분포'다.
      이 분포가 접촉역학(GW)을 거쳐 MRR·WIWNU·스크래치로 이어진다 — 시뮬레이터와의 접점.
    fields:
      - key: asperity_sigma_m
        label: asperity 높이 표준편차
        type: number
        unit: m
        origin: researched
        maps_to: pad_sigma0_m
        status: wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
        note: >
          base.yaml 의 pad_sigma0_m(8.112e-6 m)이 바로 이 노트 Table 1 실측값이다.
          D_grit=190 µm 컨디셔너에서 역산된 값 — 즉 팩의 이 숫자는 이미 컨디셔너 사양의 함수다.
      - key: asperity_beta_inv_m
        label: 높이분포 스케일 (1/β)
        type: number
        unit: m
        origin: researched
        maps_to: pad_height_beta_inv_m
        status: partial
        confidence: estimated
        source: knowledge/equipment/conditioner-asperity-population-balance.md
        note: >
          컨디셔닝이 진행되면 분포가 좁아지고(긴 asperity부터 잘림) 정규에서 준지수로 수렴한다
          (Ring et al. 유사해). 팩 값은 현재 상수라 이 동역학이 반영돼 있지 않다 → partial.
      - key: pad_ra_um
        label: 패드 표면조도 Ra
        type: number
        unit: µm
        typical: [3, 8]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Kwon(2013) 17k 디스크 7.89 µm vs 60k 디스크 6.37 µm(3D 레이저현미경).
          Entegris 실측은 신품 패드 4.6 µm에서 0.5시간 만에 3.3 µm로 급락 후 17시간 유지.
      - key: distribution_shape
        label: 높이분포 형태
        type: enum
        options: [gaussian_new_pad, exponential_worn, truncated_glazed]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-asperity-population-balance.md
        note: >
          신품은 정규, 마모 후는 지수, 컨디셔닝 없이 다매 연마하면 꼭대기가 잘린 truncated.
          컨디셔닝 부재는 단순 높이 감소가 아니라 분포 형태 자체를 바꾼다.

  # ═══════════════════════════════ 10) 브레이크인
  - id: break_in
    label: "브레이크인 (디스크·패드 길들이기)"
    origin: researched
    owner: disk-conditioner
    why: >
      신품 디스크·신품 패드는 정상상태가 아니다. 초기 과도구간을 어떻게 처리하느냐가
      첫 웨이퍼들의 MRR·결함을 좌우한다. 실무 절차이나 문헌 정량화가 가장 빈약한 축.
    fields:
      - key: required
        label: 브레이크인 수행 여부
        type: enum
        options: [required, optional, not_performed]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M 연장 런은 디스크 브레이크인을 수행하지 않았다고 명시했고, 동시에 CoO
          개선 레버로 브레이크인 시간 단축을 든다 — 존재하지만 설계에 따라 생략 가능한 절차.
      - key: duration_min
        label: 브레이크인 시간
        type: number
        unit: min
        origin: researched
        status: not_wired
        confidence: unverified
        note: >
          ⚠ 조사 필요. 패드 Ra 수렴 시상수는 0.5시간 내 90% 이상(Entegris 실측)으로 매우
          짧다는 간접 근거만 있고, 디스크 자체의 표준 브레이크인 시간·매수 규정은 문헌 미확보.
      - key: medium
        label: 브레이크인 매질
        type: enum
        options: [di_water, slurry, dry]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
        note: Entegris·3M 벤치 시험은 DI water 조건. 양산 관행(슬러리 사용 여부)은 ⚠ 미확보.
      - key: ra_settling_h
        label: 조도 수렴 시상수
        type: number
        unit: h
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
        note: >
          Entegris Case Study 3 — Ra 4.6에서 3.3 µm로(0.5h), 이후 17시간 동안 오차범위 내 동일.
          ⚠ 지수형 가정 자체는 fab-sim의 편의적 근사(논문은 곡선형을 명시하지 않음).

  # ═══════════════════════════════ 11) 수명·교체
  - id: lifetime
    label: "디스크 수명 · 교체 기준"
    origin: researched
    owner: disk-conditioner
    why: >
      디스크는 소모품이다. 언제 갈아야 하는가(PCR 몇 % 하락? 몇 시간? 몇 매?)가
      CoO와 공정 안정성을 동시에 결정한다. 디스크 수명과 패드 수명은 다른 축이다.
    fields:
      - key: pcr_decay_anchor_h
        label: PCR 감쇠 앵커 시간
        type: number
        unit: h
        origin: researched
        maps_to: pad_pcr_anchor_hours
        status: wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
        note: >
          base.yaml pad_pcr_anchor_hours = 50 h 가 이 값이다. Entegris 사례에서 50시간 사용
          디스크의 평균 PCR이 초기 대비 16%로 떨어졌을 때 교체했다.
      - key: pcr_decay_anchor_ratio
        label: 앵커 시점 PCR 비율
        type: number
        unit: "-"
        origin: researched
        maps_to: pad_pcr_anchor_ratio
        status: wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-pad-cutting-model.md
        note: >
          base.yaml pad_pcr_anchor_ratio = 0.16. PCR_inf≈0 근사로 τ = -50/ln(0.16) ≈ 27.4 h.
          ⚠ 이 16%는 Entegris 문서가 재인용한 별도 사례(2차 인용)라 완전 검증은 아니다.
      - key: disk_life_h
        label: 디스크 수명 (시간)
        type: number
        unit: h
        typical: [50, 60]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M은 디스크당 60시간 이상 컨디셔닝, 5,300매 이상 처리하고도 성능을 유지했다.
          Entegris 사례는 50시간에 교체. 설계에 따라 크게 다르다.
      - key: pad_life_wafers
        label: 패드 수명 (디스크가 좌우)
        type: number
        unit: "wafers"
        typical: [1000, 1500]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          디스크 설계가 패드 수명을 1.5~2배 바꾼다. AMAT-3M 실측은 패드당 약 1,150매
          (패드세트당 2,350매, 범위 1,600~3,000), 총 소모품 원가 최대 22% 절감.
      - key: eol_criterion
        label: 수명 종료 판정 기준
        type: enum
        options: [pcr_drop_pct, groove_worn_out, mrr_wiwnu_abrupt_change, fixed_hours, fixed_wafers]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Son&Lee(2021) 정의는 그루브 완전 마모 또는 MRR·WIWNU 급변 중 먼저 오는 시점.
          실측 Case I에서 MRR 401.3에서 221.0 nm/min으로(16h, 44.9% 감소), 급락은 12h부터 시작.
      - key: grit_pullout_rate
        label: 그릿 탈락률
        type: number
        unit: "%/h"
        origin: researched
        status: not_wired
        confidence: unverified
        note: >
          ⚠ 조사 필요 — 문헌 공백. 확보한 논문들은 전부 컨디셔너가 패드에 남기는 결과를
          측정했지 컨디셔너 자체가 얼마나 닳는가는 측정하지 않았다. 디스크 수명 모델의 결손 항.

  # ═══════════════════════════════ 12) 결함·오염 부작용
  - id: defect_side_effects
    label: "부작용 (스크래치 · 디브리 · 오염)"
    origin: researched
    owner: disk-conditioner
    why: >
      컨디셔닝은 결함을 크게 줄이지만(무컨디셔닝 대비 macro 결함 54에서 3으로), 동시에
      스크래치의 원인(패드 디브리·탈락 그릿)이기도 하다. 양날이라 별도 그룹으로 둔다.
    fields:
      - key: pad_debris_generation
        label: 패드 디브리 생성
        type: text
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          디브리 크기 분포는 그릿 밀도보다 grade(형상)에 더 민감하다. sharp 그릿이 더 깊이
          파고들어 더 큰 디브리를 만든다. 이 디브리가 웨이퍼 스크래치의 직접 원인.
      - key: scratch_density_per_cm2
        label: 스크래치 밀도
        type: number
        unit: "count/cm²"
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          Kwon(2013) 기준 조건 0.05 개/cm²(200 mm 웨이퍼, 10 mm EE, 웨이퍼당 약 18개).
          비자명한 결과 — 밀도 40k·grade 640을 넘으면 스크래치 수가 포화한다.
          즉 MRR과 스크래치가 항상 동행하지는 않는다.
      - key: defect_adders
        label: 결함 adder (컨디셔닝 기여)
        type: number
        unit: "count"
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-disk-spec-recipe-industrial.md
        note: >
          AMAT-3M 연장 런은 패드·디스크 수명 전 구간에서 adder 평균 23개를 유지했다.
          3M 설계 개선 사례(Cu 블랭킷)에서는 micro 67~75에서 0~9, macro 3에서 0으로 감소.
      - key: disk_cleaning
        label: 디스크 세정 방식
        type: enum
        options: [di_water_jet, ultrasonic, none]
        origin: researched
        status: not_wired
        confidence: literature
        source: knowledge/equipment/conditioner-grit-wear-scratch-lifetime.md
        note: >
          ex-situ 조건에서 컨디셔닝 후 DIW 제트 3분 스프레이가 스크래치를 낮췄다(Kwon 2013).
          디스크·패드에 낀 디브리를 웨이퍼에 옮기지 않는 것이 목적.
