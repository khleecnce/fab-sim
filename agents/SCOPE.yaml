# 조사 범위 통제 — 에이전트가 무엇을·어떻게·어디까지 조사할지 사용자가 정한다
#
# 2026-09-05 사용자 지시:
#   "서브 수준에서 특허/논문 어떤걸 조사할지, 어떤식으로 조사할지, 어떤 범위내에서
#    조사할지, 어떤 데이터를 제외시킬지 등 이러한 디테일들을 컨트롤할 수 있게"
#
# 이 파일이 정본이다. UI(scope 탭)는 이 파일을 편집하는 창일 뿐이고,
# 학습 크론(성장엔진·심야병렬·학습총괄)은 매 실행 이 파일을 읽어 그대로 따른다.
# 여기 없는 소스는 쓰지 않는다. 여기서 제외한 것은 인용하지 않는다.

version: 1

# ─────────────────────────────────────────── 전역 기본값
defaults:
  # 어떤 종류의 자료를 쓰나 (우선순위 순)
  sources:
    - id: primary_paper
      label: 1차 논문 (동료심사)
      enabled: true
      weight: 1.0
      note: DOI로 실존 확인 가능한 것만. verify_claims.py가 검사한다.
    - id: patent
      label: 특허
      enabled: true
      weight: 0.9
      note: >
        소모품 설계(슬러리 조성·패드 구조·디스크 그릿)는 논문보다 특허에 구체적
        수치가 많고 전부 무료다. 단 특허의 수치는 청구범위 확보용 광범위 나열이
        많아 "대표값"으로 쓰면 안 된다 — 범위로만 인용.
    - id: review
      label: 리뷰 논문
      enabled: true
      weight: 0.6
      note: 개관용. 여기서 얻은 수치는 반드시 원논문 추적 후 사용.
    - id: thesis
      label: 학위논문
      enabled: true
      weight: 0.7
      note: 실험 상세가 풍부. MIT/Utah 등 공개본 위주.
    - id: vendor_doc
      label: 업체 기술문서
      enabled: true
      weight: 0.5
      note: Entegris·Cabot·Pureon 등. 마케팅 수치 주의 — 조건 명시 없으면 미검증.
    - id: conference
      label: 학회 발표자료
      enabled: true
      weight: 0.5
    - id: textbook
      label: 교과서
      enabled: false
      note: 전문 확보 불가. 사용자가 papers/에 PDF를 넣으면 활성화.
    - id: blog_forum
      label: 블로그·포럼
      enabled: false
      note: 출처 추적 불가. 기본 금지.
    - id: llm_memory
      label: 모델 기억
      enabled: false
      note: >
        절대 금지. "내가 아는 바로는"으로 시작하는 수치는 전부 할루시네이션 후보다.
        출처 없는 수치는 노트에 쓰지 않는다.

  # 어떻게 조사하나
  method:
    max_sources_per_unit: 6        # 단원 하나에 인용 상한 (더 넓히면 얕아진다)
    min_primary_per_unit: 1        # 1차 출처 최소 (품질게이트와 동일)
    require_doi_check: true        # DOI 실존 API 조회 강제
    require_verify_block: true     # 수치 주장은 실행 가능한 코드로
    paywall_fallback: true         # OA 없으면 미러 사이트 시도 (사용자 승인 9/5)
    prefer_recent_years: 15        # 최근 N년 우선. 고전 논문은 예외 목록으로.
    classic_exceptions:            # 연식 무관 필수 문헌
      - "Preston 1927"
      - "Greenwood & Williamson 1966"
      - "Stine 1997"
      - "Luo & Dornfeld 2001"

  # 무엇을 제외하나
  exclude:
    keywords:                      # 제목·초록에 이 단어가 있으면 후보에서 제외
      - "machine learning only"    # 물리 없는 순수 ML 예측 논문
      - "review of reviews"
    publishers: []                 # 특정 출판사 배제 (필요 시)
    before_year: 1990              # 이 이전은 classic_exceptions만
    require_experimental: false    # true면 실험 데이터 없는 논문 제외
    note: >
      제외 사유는 노트에 기록한다. "찾았지만 범위 밖이라 뺐다"와 "못 찾았다"는
      다르다 — 후자만 미검증이다.

# ─────────────────────────────────────────── 에이전트별 재정의
# 여기 없는 에이전트는 defaults를 그대로 쓴다.
agents:

  slurry-abrasive:
    focus: >
      입자 자체의 물성 — 실리카/세리아/알루미나의 크기·형상·경도·표면화학.
      슬러리 제형(조성비·첨가제)은 slurry-chemistry 소관이니 넘보지 마라.
    sources:
      patent: { weight: 1.0, note: "입자 제조법·표면개질은 특허가 1차 자료" }
      vendor_doc: { weight: 0.7, note: "Cabot·Fuso 입자 스펙시트" }
    keywords_include:
      - "colloidal silica CMP abrasive"
      - "ceria abrasive particle size distribution"
      - "abrasive hardness removal rate"
    exclude:
      keywords: ["polishing of optical glass"]   # 광학연마는 조건이 다름
      note: 광학·금속가공 연마는 압력·속도 영역이 CMP와 달라 제외

  film-cu:
    focus: >
      Cu CMP의 전기화학 — Pourbaix, BTA 패시베이션, 산화제-억제제 균형,
      dishing/erosion. 배리어(Ta/TaN)는 Lv2-2에서만.
    sources:
      primary_paper: { weight: 1.0 }
      patent: { weight: 0.8, note: "Cu 슬러리 조성 특허" }
    keywords_include:
      - "copper CMP corrosion inhibitor BTA"
      - "Cu dishing erosion pattern density"
      - "hydrogen peroxide copper removal mechanism"
    exclude:
      keywords: ["electroplating", "electrodeposition"]
      note: 도금은 Cu 성막 공정이라 CMP와 무관

  wafer-metrology:
    focus: >
      지표 정의의 표준화가 최우선. SEMI 표준·장비사 매뉴얼이 논문보다 중요하다.
      ⚠ 사용자의 회사 관행 정의를 그대로 쓰지 마라 — 문헌 정의로 확정할 것.
    sources:
      primary_paper: { weight: 0.8 }
      vendor_doc: { weight: 1.0, note: "KLA·Onto·Nova 계측 장비 매뉴얼이 정의의 실질 표준" }
      standard: { weight: 1.0, enabled: true, label: "SEMI/ASTM 표준" }
    keywords_include:
      - "SEMI standard wafer thickness variation TTV"
      - "within-wafer non-uniformity definition CMP"
      - "wafer flatness metrology 49 point 81 point"

  surface-contamination:
    focus: post-CMP 금속 오염(Cu·Fe·K·Ca·Al)·이온·유기 잔류. TXRF/VPD-ICPMS 정량.
    sources:
      primary_paper: { weight: 1.0 }
      standard: { weight: 0.9, enabled: true, label: "IRDS 허용치" }
    keywords_include:
      - "post CMP metallic contamination TXRF"
      - "wafer surface metal ion cleaning CMP"
      - "IRDS surface contamination limit"

  cmp-calibrator:
    focus: >
      ★제품 핵심. 물리 prior + 실데이터 잔차 보정 방법론. GP/베이지안 계층모델.
      소량 데이터 외삽이 핵심 — 대규모 데이터 전제 논문은 우리 상황과 다르다.
    sources:
      primary_paper: { weight: 1.0 }
      review: { weight: 0.8, note: "베이지안 캘리브레이션은 리뷰가 유용" }
    keywords_include:
      - "Bayesian calibration computer model KOH"
      - "Gaussian process surrogate physics prior"
      - "transfer learning small data semiconductor process"
    exclude:
      require_experimental: false
      keywords: ["deep learning big data"]
      note: 고객 데이터는 레시피당 수십 장 규모. 빅데이터 전제 방법은 적용 불가.
