name: verify

# 이 저장소는 private이라 Actions 분(minute)이 과금 대상이다.
# 에이전트 크론이 하루 수십 커밋을 밀어 넣는데, 그 중 대부분은
# knowledge/·papers/·agents/ 같은 문서·데이터 변경이라 pytest 결과에
# 영향이 없다. 무료 2000분이 그렇게 소진돼 2026-09 결제 차단이 걸렸다.
# → push 빌드는 코드/테스트/의존성 변경으로만 한정한다.
#   전체 스위트를 강제로 돌리고 싶으면 Actions 탭에서 수동 실행.
on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

# 크론 에이전트가 몇 분 간격으로 연속 push 하면 그 사이 run들이 전부
# 끝까지 돌아 분을 태운다. 같은 브랜치에서는 최신 run만 남긴다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: 단위 테스트 (필수 — 코드 정합성)
        run: python -m pytest -q

  # 지식 품질 게이트는 모든 스텝이 continue-on-error라 무엇도 막지 못하면서
  # run 하나당 ubuntu 분을 그대로 소모했다. push마다 돌릴 이유가 없어
  # 주 1회(월요일 03:00 UTC = 12:00 KST) + 수동 실행으로 분리한다.
  # → .github/workflows/knowledge-quality.yml
