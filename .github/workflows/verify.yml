name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: 단위 테스트 (필수 — 코드 정합성)
        run: python -m pytest -q

  knowledge-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: 지식 품질 게이트 (참고용 — 미상환 부채 있어 non-blocking, 로그로 진행상황 추적)
        continue-on-error: true
        run: python tools/check_knowledge.py --all
      - name: 주장 검증 — 출처 실존 + 코드 재현 (참고용 — non-blocking)
        continue-on-error: true
        run: python tools/verify_claims.py --all
