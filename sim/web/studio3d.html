<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FabSim — CMP 시뮬레이터</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a23; --panel2:#1a2430; --line:#243141;
    --fg:#e6edf3; --dim:#8b9cb0; --accent:#4da3ff; --warn:#ffb454;
    --bad:#ff6b6b; --good:#5ddc9a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       overflow:hidden}
  #app{display:flex;height:100vh}
  #view{flex:1;position:relative;min-width:0}
  canvas{display:block}
  #hint{position:absolute;left:14px;top:12px;color:var(--dim);font-size:12px;
        background:rgba(11,15,20,.72);padding:7px 11px;border-radius:7px;
        border:1px solid var(--line);pointer-events:none}
  #label{position:absolute;padding:4px 9px;background:var(--accent);color:#04121f;
         font-weight:600;font-size:12px;border-radius:5px;pointer-events:none;
         display:none;transform:translate(-50%,-140%);white-space:nowrap}
  #side{width:400px;background:var(--panel);border-left:1px solid var(--line);
        display:flex;flex-direction:column}
  #tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  .tab{flex:1;padding:9px 4px;text-align:center;cursor:pointer;color:var(--dim);
       font-size:11px;border-bottom:2px solid transparent;user-select:none;min-width:60px}
  .tab:hover{color:var(--fg);background:var(--panel2)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel2)}
  #body{flex:1;overflow-y:auto;padding:14px}
  h3{margin:0 0 4px;font-size:14px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:14px;line-height:1.5}
  .fld{margin-bottom:13px}
  .fld label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .fld .val{color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         padding:6px;border-radius:5px;font-size:12px}
  .meta{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.45}
  .dead{color:var(--warn)}
  .weak{color:#8ab4d8}
  #out{border-top:1px solid var(--line);padding:11px 14px;background:var(--panel2);
       max-height:44vh;overflow-y:auto;flex-shrink:0}
  .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
  .row b{font-variant-numeric:tabular-nums}
  .sec{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;
       margin:11px 0 5px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  .fchip{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
  .fsym{width:19px;font-weight:700;text-align:center;font-size:14px}
  .bar{flex:1;height:5px;background:#0a0f15;border-radius:3px;overflow:hidden;position:relative}
  .bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
  .bar i.lo{background:var(--bad)} .bar i.hi{background:var(--good)}
  .fval{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
  .tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#2a3644;color:var(--dim)}
  .tag.unmodeled{background:#4a2f1a;color:var(--warn)}
  .tag.partial{background:#3a3a1a;color:#ffe08a}
  .tag.modeled{background:#1a3a2a;color:var(--good)}
  #notes{font-size:10.5px;color:var(--dim);line-height:1.55}
  #notes div{padding:3px 0;border-bottom:1px solid #1b2430}
  #notes div.w{color:var(--warn)}
  .btn{width:100%;padding:9px;background:var(--accent);color:#04121f;border:0;
       border-radius:6px;font-weight:700;cursor:pointer;font-size:12px;margin-top:6px}
  .banner{background:#2a1f14;border:1px solid #4a3a20;color:var(--warn);
          padding:8px 10px;border-radius:6px;font-size:11px;margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hint">드래그=회전 · 휠=줌 · <b>장비 부위를 클릭하면 설정 패널이 열립니다</b></div>
    <div id="label"></div>
  </div>
  <div id="side">
    <div id="tabs"></div>
    <div id="body"></div>
    <div id="out"></div>
  </div>
</div>
<script>
"use strict";
const API = location.origin;

/* ══════════════════════════════════════════════════════════════
   파트 정의 — ARCHITECTURE-V2.md §1
   각 필드의 `pk`는 팩 키다. 없으면 UI에만 있고 엔진에 안 붙은 것 →
   'dead:true'로 표시해 **거짓 UI를 만들지 않는다**.
   (V1 demo_app의 film 드롭다운이 골라도 Kp가 안 변하는 거짓 UI였다.)
   ══════════════════════════════════════════════════════════════ */
const PARTS = {
  tool: { name:"① Tool", icon:"⚙",
    sub:"Operator set-points on a production polisher (AMAT Reflexion / Mirra class). 'Tool Outputs' below are derived diagnostics, not settings.",
    fields:[
      {section:"Polish Recipe"},
      {k:"pressure_psi", l:"Pressure", u:"psi", min:0.5, max:8, step:0.1, pk:"pressure_psi"},
      {k:"rotation", l:"Rotation (P/H)", special:"rotation", u:"rpm",
       min:10, max:150, step:1,
       hint:"P=플래튼, H=헤드(캐리어). 실제 레시피 표기와 같이 한 칸에 둔다."},
      {k:"sfr_ml_min", l:"Slurry Flow Rate (SFR)", u:"mL/min", min:20, max:400, step:5, pk:"sfr_ml_min"},
      {k:"time_s", l:"Polish Time", u:"s", min:10, max:300, step:5, special:"time"},
      {section:"Conditioner"},
      {k:"cond_downforce_lbf", l:"Conditioner Force", u:"lbf", min:0, max:12, step:0.5, pk:"cond_downforce_lbf"},
      {k:"cond_duty_pct", l:"Conditioning Duty", u:"%", min:0, max:100, step:5, pk:"cond_duty_pct",
       hint:"100%=in-situ 연속. 0이면 3D 디스크 스윕이 멈춘다."},
      {section:"Tool Constants (not recipe)"},
      {k:"center_offset_m", l:"Head Offset r_cc", u:"m", min:0.10, max:0.30, step:0.005, pk:"center_offset_m",
       hint:"웨이퍼 중심↔플래튼 중심 거리. 헤드가 플래튼 어디에 놓이느냐로 정해지는 장비 고정값이라 매 레시피에서 만지는 값이 아니다. 상대속도 V=ω_p·r_cc 로 MRR에 들어간다. 300mm 툴 전형 0.18m."},
    ]},
  slurry:{ name:"② Slurry", icon:"💧",
    sub:"Units a slurry formulator actually mixes in. Changing loading must change per-film R/R.",
    fields:[
      {k:"slurry_ph", l:"pH", u:"", min:0, max:14, step:0.1, pk:"slurry_ph",
       hint:"실리카 팩: pH 11 정점(Li 2021). 세리아 팩: 2.5~6.8 정전 창, pH 6 넘으면 급락(Dandu 2009). 실측 범위 밖은 외삽이다."},
      {k:"abrasive_wt_pct", l:"Abrasive Loading", u:"wt%", min:0, max:50, step:0.5, pk:"abrasive_wt_pct",
       hint:"7 wt% 이상은 Luo-Dornfeld 포화 — 더 넣어도 MRR이 안 오른다고 실측된 계가 있다. 그 구간은 과대평가."},
      {k:"abrasive_size_nm", l:"Abrasive Size D50", u:"nm", min:20, max:150, step:5, pk:"abrasive_size_nm",
       dead:"입경 지수가 문헌 미확정(OCR 손상)이라 항을 만들지 않았다. 지어내는 대신 비워뒀다."},
      {k:"oxidizer_wt_pct", l:"Oxidizer", u:"wt%", min:0, max:8, step:0.1, pk:"oxidizer_wt_pct",
       dead:"이 팩(산화막/실리카)에는 산화제 파라미터가 없다. Cu/W 팩에서 활성화된다."},
      {k:"inhibitor_mM", l:"Corrosion Inhibitor (BTA)", u:"mM", min:0, max:10, step:0.1, pk:"inhibitor_mM",
       dead:"산화막 팩에 억제제가 없다 — Cu 팩(cu_h2o2_bta)에서 살아난다."},
    ]},
  pad:{ name:"③ Pad", icon:"▤",
    sub:"Pad sets both Contact (κ) and Slurry Transport (τ).",
    fields:[
      {k:"pad_hardness_shore_d", l:"Hardness", u:"Shore D", min:35, max:80, step:1, pk:"pad_hardness_shore_d"},
      {k:"groove_width_um", l:"Groove Width", u:"µm", min:200, max:1200, step:25, pk:"groove_width_um",
       weak:"⚠ η는 600µm에서 정점이고 900µm에선 오히려 내려간다(Mu 2016 실측). 넓힐수록 좋지 않다. 실측범위 300~900µm 밖은 외삽하지 않고 끝값 고정."},
      {k:"pad_porosity_pct", l:"Porosity", u:"%", min:10, max:50, step:1, pk:"pad_porosity_pct",
       weak:"⚠ 기공률 15→45%(3배)에도 MRR은 8%만 오른다(Prasad 2013). '슬러리를 더 나르면 비례해 오른다'는 직관은 실측으로 기각됐다."},
      {k:"groove_depth_mm", l:"Groove Depth", u:"mm", min:0.2, max:1.5, step:0.02, pk:"groove_depth_mm",
       dead:"깊이는 아직 τ에 연결되지 않았다 — 확보된 문헌이 폭·기공률만 정량화했다. 값을 바꿔도 MRR이 안 변한다."},
      {k:"groove_pitch_mm", l:"Groove Pitch", u:"mm", min:1, max:8, step:0.05, pk:"groove_pitch_mm",
       dead:"간격도 미연결. 위와 같다."},
    ]},
  disk:{ name:"④ Disk", icon:"◈",
    sub:"Conditioner disk. Geometry is a consumable (κ); downforce & sweep are tool set-points (Γ) — different axes, never mixed.",
    fields:[
      {k:"asperity_density_per_m2", l:"Asperity Density", u:"1/m²", min:2e10, max:4e11, step:1e10,
       pk:"asperity_density_per_m2", fmt:v=>v.toExponential(2)},
      {k:"pad_asperity_radius_m", l:"Asperity Tip Radius", u:"m", min:1e-6, max:2e-5, step:1e-6,
       pk:"pad_asperity_radius_m", fmt:v=>v.toExponential(2),
       dead:"GW 접촉 모델(tier2.gw_physical_kp)에서만 살아난다. Preston 모델에선 안 쓰인다."},
    ]},
  wafer:{ name:"⑤ Wafer", icon:"◯",
    sub:"⚠ Wafer is the target film, not a tuning parameter. It is excluded from merged parameters and serves only as the baseline for post-polish performance.",
    fields:[
      {k:"pack", l:"Film / Parameter Pack", special:"pack"},
      {k:"initial_thickness_nm", l:"Initial Thickness", u:"nm", min:200, max:5000, step:50, special:"thick"},
      {k:"wafer", l:"Wafer Type (NPW)", special:"wafertype"},
    ]},
  data:{ name:"⑥ Data", icon:"📊",
    sub:"Every run is stored automatically. Drop measurement files (Excel/CSV) to store as-is; with ≥3 for a pack, a Kp calibration factor is computed.",
    fields:[ {special:"data"} ]},
};

const state = { pack:"oxide_silica", wafer:"NPW", time_s:60,
                initial_thickness_nm:1000, overrides:{}, base:{}, packs:[] };
let current = "tool";

/* ─────────────────────────────────────────── 3D 씬
   실제 회전식 CMP 폴리셔(AMAT Reflexion/Mirra, Ebara F-REX급) 구조를 재현한다.
   스케일: 1 unit ≈ 253 mm  (플래튼 Ø760mm → R=1.5, 300mm 웨이퍼 → R=0.59,
   r_cc 180mm → 0.71, 컨디셔너 디스크 Ø100mm → R=0.2)
   외부 의존 이름: hot / buildGrooves / buildGrits / waferMat  (+ num, select 호출)
   ────────────────────────────────────────────────────────────── */
const view = document.getElementById("view");
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
const rend = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
rend.shadowMap.enabled = true;
rend.shadowMap.type = THREE.PCFSoftShadowMap;
rend.toneMapping = THREE.ACESFilmicToneMapping;
rend.toneMappingExposure = 1.05;
rend.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(rend.domElement);
const ANISO = rend.capabilities.getMaxAnisotropy();

/* ── 배경: 방사 그라데이션 (CDN 의존 없음) ── */
(function(){
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(256,230,40, 256,256,380);
  grd.addColorStop(0, "#1c2330"); grd.addColorStop(0.55, "#0f141b"); grd.addColorStop(1, "#06080b");
  g.fillStyle = grd; g.fillRect(0,0,512,512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();
scene.fog = new THREE.Fog(0x0a0d12, 7, 18);

/* ── 환경맵: 스튜디오 룸을 코드로 만들어 PMREM (RoomEnvironment 동등, CDN 불필요) ── */
(function(){
  try{
    const room = new THREE.Scene();
    const box = new THREE.Mesh(new THREE.BoxGeometry(12,12,12),
      new THREE.MeshStandardMaterial({color:0x3a4048, side:THREE.BackSide, roughness:1, metalness:0}));
    box.position.y = 4; room.add(box);
    const lamp = (w,h,x,y,z,ry,rx,I,tint)=>{
      const col = new THREE.Color(tint||0xffffff).multiplyScalar(I);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:col, side:THREE.DoubleSide}));
      m.position.set(x,y,z); m.rotation.set(rx||0, ry||0, 0); room.add(m);
    };
    lamp(6,2.2,  0, 9.5,  0,   0, -Math.PI/2, 14, 0xf4f7ff);   // 천장 소프트박스
    lamp(2.5,6, -5.9, 5, 0,  Math.PI/2, 0, 9, 0xe9f0ff);          // 좌 스트립
    lamp(2.5,6,  5.9, 5, 0, -Math.PI/2, 0, 6, 0xffffff);          // 우 스트립
    lamp(8,1.2,  0, 6.5, -5.9, 0, 0, 5, 0xbfd6ff);                // 후면 림 (차가움)
    lamp(3,3,    0, 3.5,  5.9, Math.PI, 0, 2.5, 0xffffff);        // 정면 필
    const pm = new THREE.PMREMGenerator(rend); pm.compileEquirectangularShader();
    scene.environment = pm.fromScene(room, 0.04).texture;
    pm.dispose();
  }catch(e){ console.warn("env map 실패, 라이트만 사용", e); }
})();

/* ── 조명: 클린룸 차가운 백색 키 + 필 + 림, 소프트 섀도 ── */
scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x151a20, 0.55));
const key = new THREE.DirectionalLight(0xf3f7ff, 2.6);
key.position.set(3.5,7.5,3); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4.2;
key.shadow.camera.right = key.shadow.camera.top = 4.2;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe9ff, 0.7); fill.position.set(-5,3,4); scene.add(fill);
const rim  = new THREE.DirectionalLight(0x8fbaff, 1.4); rim.position.set(-3,4,-6); scene.add(rim);

/* ── 재질 (PBR) ── */
const M = {
  steel:   new THREE.MeshStandardMaterial({color:0xd5dae0, metalness:1.0, roughness:0.28}),
  steelD:  new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:1.0, roughness:0.36}),
  alu:     new THREE.MeshStandardMaterial({color:0xb9bfc7, metalness:1.0, roughness:0.42}),
  anod:    new THREE.MeshStandardMaterial({color:0x2b3037, metalness:0.9, roughness:0.5}),
  frame:   new THREE.MeshStandardMaterial({color:0xe3e6ea, metalness:0.15, roughness:0.55}), // 분체도장 패널
  black:   new THREE.MeshStandardMaterial({color:0x14171b, metalness:0.6, roughness:0.6}),
  pps:     new THREE.MeshStandardMaterial({color:0xd8d0bc, metalness:0.0, roughness:0.62}),  // 리테이너 링 PPS
  rubber:  new THREE.MeshStandardMaterial({color:0x1b1d20, metalness:0.0, roughness:0.9}),
  bolt:    new THREE.MeshStandardMaterial({color:0x6d7680, metalness:1.0, roughness:0.45}),
  tube:    new THREE.MeshStandardMaterial({color:0xcfd5db, metalness:1.0, roughness:0.22}),
  hose:    new THREE.MeshStandardMaterial({color:0xf2f4f6, metalness:0.0, roughness:0.35, transparent:true, opacity:0.85}),
};

/* ── 기하 헬퍼 ── */
/* 챔퍼 원통 (LatheGeometry) : 모든 금속 원통은 모서리를 깎는다 */
function chamferCyl(r, h, c, seg){
  seg = seg||96; c = Math.min(c, r*0.45, h*0.45);
  const pts = [ new THREE.Vector2(0,-h/2), new THREE.Vector2(r-c,-h/2),
    new THREE.Vector2(r,-h/2+c), new THREE.Vector2(r,h/2-c),
    new THREE.Vector2(r-c,h/2), new THREE.Vector2(0,h/2) ];
  const g = new THREE.LatheGeometry(pts, seg); g.computeVertexNormals(); return g;
}
/* 챔퍼 링(관) : 리테이너 링, 트레이 등 */
function chamferRing(ri, ro, h, c, seg){
  seg = seg||96; c = Math.min(c, (ro-ri)*0.45, h*0.45);
  const pts = [ new THREE.Vector2(ri,-h/2), new THREE.Vector2(ro-c,-h/2), new THREE.Vector2(ro,-h/2+c),
    new THREE.Vector2(ro,h/2-c), new THREE.Vector2(ro-c,h/2), new THREE.Vector2(ri+c,h/2),
    new THREE.Vector2(ri,h/2-c), new THREE.Vector2(ri,-h/2) ];
  const g = new THREE.LatheGeometry(pts, seg); g.computeVertexNormals(); return g;
}
function mesh(geo, mat, x,y,z, parent, shadow){
  const m = new THREE.Mesh(geo, mat); m.position.set(x||0,y||0,z||0);
  m.castShadow = shadow!==false; m.receiveShadow = true; (parent||scene).add(m); return m;
}
/* 볼트 원(六角 헤드) */
function boltCircle(parent, R, y, n, s){
  const g = new THREE.CylinderGeometry(s, s, s*0.9, 6);
  const im = new THREE.InstancedMesh(g, M.bolt, n);
  const o = new THREE.Object3D();
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2;
    o.position.set(Math.cos(a)*R, y, Math.sin(a)*R); o.rotation.y = a; o.updateMatrix();
    im.setMatrixAt(i, o.matrix);
  }
  im.castShadow = true; parent.add(im); return im;
}
/* 두 점 사이 파이프 */
function pipe(a, b, r, mat, parent){
  const d = new THREE.Vector3().subVectors(b,a), L = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,24), mat||M.tube);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  m.castShadow = true; (parent||scene).add(m); return m;
}

const hot = {};   // 클릭 가능한 파트 (메시)

/* ── 클린룸 바닥 + 그리드 ── */
(function(){
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d");
  g.fillStyle = "#2a2e34"; g.fillRect(0,0,256,256);
  g.strokeStyle = "rgba(255,255,255,0.10)"; g.lineWidth = 2; g.strokeRect(1,1,254,254);
  g.strokeStyle = "rgba(255,255,255,0.035)"; g.lineWidth = 1;
  for(let i=64;i<256;i+=64){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,256); g.moveTo(0,i); g.lineTo(256,i); g.stroke(); }
  const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(30,30); tex.anisotropy = ANISO; tex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,30),
    new THREE.MeshStandardMaterial({map:tex, color:0xffffff, metalness:0.25, roughness:0.38}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.95; floor.receiveShadow = true; scene.add(floor);
})();

const PAD_PX = 2048, PAD_R_MM = 380;      // 패드 반지름 380 mm (Ø760)
const padCanvas = document.createElement("canvas"); padCanvas.width = padCanvas.height = PAD_PX;
const padBump = document.createElement("canvas"); padBump.width = padBump.height = PAD_PX;
const padBase = (function(){               // 노이즈 베이스는 한 번만 만든다
  const c = document.createElement("canvas"); c.width = c.height = PAD_PX;
  const g = c.getContext("2d");
  g.fillStyle = "#9a9a6d"; g.fillRect(0,0,PAD_PX,PAD_PX);
  const img = g.getImageData(0,0,PAD_PX,PAD_PX), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*26, p = Math.random()<0.06 ? -22 : 0;  // 기공
    d[i]=Math.max(0,d[i]+n+p); d[i+1]=Math.max(0,d[i+1]+n+p); d[i+2]=Math.max(0,d[i+2]+n*0.8+p);
  }
  g.putImageData(img,0,0);
  /* 사용 흔적: 방사형 미세 연마 자국 */
  g.strokeStyle = "rgba(255,255,255,0.05)"; g.lineWidth = 1;
  for(let i=0;i<220;i++){
    const a = Math.random()*Math.PI*2, r0 = Math.random()*PAD_PX/2, r1 = r0+40+Math.random()*300;
    g.beginPath(); g.arc(PAD_PX/2, PAD_PX/2, r0, a, a+0.02+Math.random()*0.15); g.stroke();
    void r1;
  }
  return c;
})();

function buildGrooves(pitchMM, depthMM){
  const pitch = Math.max(pitchMM, 0.6), depth = Math.max(depthMM, 0.1);
  const widthUM = (typeof num==="function") ? num("groove_width_um", 600) : 600;
  const pxPerMM = (PAD_PX/2)/PAD_R_MM;
  const g = padCanvas.getContext("2d"), b = padBump.getContext("2d");
  g.drawImage(padBase,0,0);
  b.fillStyle = "#808080"; b.fillRect(0,0,PAD_PX,PAD_PX);
  const w = Math.max(1.3, widthUM/1000*pxPerMM);
  const dark = THREE.MathUtils.clamp(0.30 + depth/1.5*0.45, 0.3, 0.8);
  g.lineWidth = w; g.strokeStyle = `rgba(28,30,18,${dark})`;
  b.lineWidth = w; b.strokeStyle = `rgb(${Math.round(128-100*THREE.MathUtils.clamp(depth/1.5,.2,1))},0,0)`;
  b.strokeStyle = b.strokeStyle.replace(/rgb\((\d+),0,0\)/, (m,v)=>`rgb(${v},${v},${v})`);
  const cx = PAD_PX/2;
  for(let r = 25*pxPerMM; r < (PAD_R_MM-6)*pxPerMM; r += pitch*pxPerMM){
    g.beginPath(); g.arc(cx,cx,r,0,Math.PI*2); g.stroke();
    b.beginPath(); b.arc(cx,cx,r,0,Math.PI*2); b.stroke();
  }
  /* 그루브 하이라이트 엣지(빛 받는 쪽) */
  g.lineWidth = Math.max(0.6, w*0.4); g.strokeStyle = "rgba(255,255,240,0.10)";
  for(let r = 25*pxPerMM + w*0.9; r < (PAD_R_MM-6)*pxPerMM; r += pitch*pxPerMM){
    g.beginPath(); g.arc(cx,cx,r,0,Math.PI*2); g.stroke();
  }
  padTex.needsUpdate = true; padBumpTex.needsUpdate = true;
}

}

function place(){
  cam.position.set(TARGET.x+dist*Math.cos(pitch)*Math.sin(yaw), TARGET.y+dist*Math.sin(pitch),
                   TARGET.z+dist*Math.cos(pitch)*Math.cos(yaw));

}

  lx=e.clientX; ly=e.clientY; place();
});
rend.domElement.addEventListener("wheel",e=>{
  e.preventDefault();
  dist = THREE.MathUtils.clamp(dist+e.deltaY*0.0035, 2.4, 11); place();
},{passive:false});

/* 클릭 → 파트 선택 */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const labelEl = document.getElementById("label");
function pick(e){
  const r = rend.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-r.left)/r.width)*2-1;
  mouse.y = -((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse, cam);
  const hits = ray.intersectObjects(Object.values(hot), false);
  if(!hits.length) return null;
  const o = hits[0].object;
  return Object.keys(hot).find(k=>hot[k]===o) || null;
}
rend.domElement.addEventListener("click",e=>{ const p=pick(e); if(p) select(p); });
rend.domElement.addEventListener("mousemove",e=>{
  if(drag){ labelEl.style.display="none"; return; }
  const p = pick(e);
  if(p){ labelEl.style.display="block"; labelEl.textContent = PARTS[p].icon+" "+PARTS[p].name;
         labelEl.style.left=e.clientX+"px"; labelEl.style.top=e.clientY+"px";
         rend.domElement.style.cursor="pointer"; }
  else { labelEl.style.display="none"; rend.domElement.style.cursor="grab"; }
});

/* ── 실행 결과 → 3D 반영 (render(d)가 호출). null 값은 건드리지 않는다 ── */
const PAD_COLD = new THREE.Color(0xffffff), PAD_HOT = new THREE.Color(0xff9a7a);
let tauSpread = 1.0;
function applyResult(d){
  if(!d) return;
  const eq = d.equipment_outputs||{}, fs = d.factors||{};
  const T = eq.pad_temp_c && eq.pad_temp_c.value;
  if(typeof T==="number" && isFinite(T)){                     // 22°C 기준 → 120°C 붉게
    const k = THREE.MathUtils.clamp((T-22)/(120-22), 0, 1);
    padMat.color.copy(PAD_COLD).lerp(PAD_HOT, k*0.85);
    padSideMat.color.set(0x8c8c62).lerp(PAD_HOT, k*0.6);
  }
  const mr = d.mean_mrr_nm_min;
  if(typeof mr==="number" && isFinite(mr))
    waferMat.emissiveIntensity = THREE.MathUtils.clamp(mr/260, .12, 1.1);
  const tau = fs.tau && fs.tau.value;
  if(typeof tau==="number" && isFinite(tau) && tau>0)         // τ(슬러리 전달) → 퍼짐 속도 가중
    tauSpread = THREE.MathUtils.clamp(Math.pow(tau, 0.6), 0.5, 1.8);
}
window.applyResult = applyResult;

/* 애니메이션 — 실제 설정값에 반응한다 */
let t=0, condPhi=0.25, headSag=0, diskSag=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=0.016; t+=dt;
  const rpmP = num("rpm_platen", 55), rpmW = num("rpm_wafer", 60);
  const sfr  = num("sfr_ml_min", 150), duty = num("cond_duty_pct", 100);
  const psi  = num("pressure_psi", 3), lbf = num("cond_downforce_lbf", 6);
  const SLOW = 0.10;                                   // 화면용 감속 배율
  platenGrp.rotation.y  += rpmP/60*dt*2*Math.PI*SLOW;  // 플래튼
  carrierGrp.rotation.y += rpmW/60*dt*2*Math.PI*SLOW;  // 헤드: 플래튼과 **같은 방향** (문헌)
  /* 하중 → 눌림 변위 (보간). pressure_psi: 헤드 전체가 내려가 링이 패드에 파묻힘. cond_downforce: 디스크 눌림 */
  const sagT = THREE.MathUtils.clamp((psi-0.5)/7.5, 0, 1)*0.028;        // 0~0.028 unit (패드 압축)
  const dskT = THREE.MathUtils.clamp(lbf/12, 0, 1)*0.016;
  headSag += (sagT-headSag)*0.08; diskSag += (dskT-diskSag)*0.08;
  carrierGrp.position.y = -headSag; headMount.position.y = -headSag;
  diskSpin.position.y = -diskSag;
  film.position.y = PAD_TOP+0.004 - headSag*0.2;
  /* 컨디셔너: duty 0이면 스윕·자전 모두 멈춘다. 암은 플래튼 밖 피벗을 중심으로 중심↔가장자리 왕복 */
  if(duty>0){
    condPhi = 0.25 + 0.27*Math.sin(t*0.5);
    diskSpin.rotation.y += 95/60*dt*2*Math.PI*SLOW;
  }
  condGrp.rotation.y = COND_YAW0 + condPhi;
  /* 슬러리: 노즐 → 패드 낙하 → 회전하며 바깥으로 번짐 */
  const active = Math.round(THREE.MathUtils.clamp(NP*sfr/400,60,NP));
  const spd = 0.55+sfr/260;
  const fs = THREE.MathUtils.clamp(0.35+sfr/400*0.65, 0.3, 1.0);
  film.scale.set(fs,fs,1); filmMat.opacity = 0.10+0.16*fs;
  puddle.scale.setScalar(0.6+sfr/400*0.8);
  for(let i=0;i<NP;i++){
    if(i>=active){ spos[i*3+1] = -99; continue; }
    if(sph[i]===0){                       // 낙하
      spos[i*3+1] -= svel[i]*spd*2.6;
      if(spos[i*3+1] <= PAD_TOP+0.012){ sph[i]=1; spos[i*3+1]=PAD_TOP+0.012; }
    } else {                              // 패드 위 확산 (플래튼 회전 + 원심)
      const x=spos[i*3], z=spos[i*3+2];
      const r=Math.hypot(x,z), a=Math.atan2(z,x)+rpmP/60*dt*2*Math.PI*SLOW;
      const nr = r + svel[i]*spd*0.85*tauSpread*(0.4+r/1.5);
      spos[i*3]=Math.cos(a)*nr; spos[i*3+2]=Math.sin(a)*nr;
      if(nr>1.5) seed(i,true);
    }
  }
  sgeo.attributes.position.needsUpdate = true;
  rend.render(scene,cam);
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  cam.aspect=w/h; cam.updateProjectionMatrix();
  rend.setSize(w,h); rend.setPixelRatio(Math.min(devicePixelRatio,2));
}
addEventListener("resize",resize); resize(); place(); tick();

/* ─────────────────────────────────────────── 패널 */
function num(key, dflt){
  if(state.overrides[key]!==undefined) return state.overrides[key];
  if(state.base[key]!==undefined) return state.base[key];
  return dflt;
}
function select(p){ current=p; drawTabs(); drawPanel(); }

function drawTabs(){
  document.getElementById("tabs").innerHTML =
    Object.entries(PARTS).map(([k,v])=>
      `<div class="tab ${k===current?'on':''}" data-k="${k}">${v.icon} ${v.name}</div>`).join("");
  document.querySelectorAll(".tab").forEach(el=>
    el.onclick=()=>select(el.dataset.k));
}

function drawPanel(){
  const P = PARTS[current];
  let h = `<h3>${P.icon} ${P.name}</h3><div class="sub">${P.sub}</div>`;
  const deadCount = P.fields.filter(f=>f.dead && !f.section).length;
  if(deadCount){
    h += `<div class="banner">⚠ 이 파트의 입력 ${deadCount}개는 <b>엔진에 연결되지
      않았다</b>. 값을 바꿔도 결과가 변하지 않는다 — 연결된 척하지 않으려고
      그대로 표시한다. 아래 주황색 설명을 보라.</div>`;
  }
  for(const f of P.fields){
    if(f.section){
      h += `<div class="sec" style="margin-top:14px">${f.section}</div>`;
      continue;
    }
    if(f.special==="data"){
      h += `
        <div id="drop" style="border:2px dashed var(--line);border-radius:8px;padding:22px 12px;
             text-align:center;color:var(--dim);cursor:pointer;margin-bottom:12px">
          <div style="font-size:22px">📂</div>
          <div><b>실측 파일을 여기 놓거나 클릭</b></div>
          <div class="meta">xlsx · csv · json — 컬럼명은 한글/영문 아무거나 (압력/psi/다운포스, 초기두께/pre, 잔막/post…)</div>
          <input type="file" id="fileIn" accept=".xlsx,.xls,.csv,.json,.tsv,.txt" style="display:none">
        </div>
        <div class="fld"><label><span>이 실측의 팩 (막질)</span></label>
          <select id="imp-pack">${state.packs.map(p=>
            `<option value="${p.id}" ${p.id===state.pack?"selected":""}>${p.id}</option>`).join("")}</select>
          <div class="meta">보정계수는 팩별로 따로 낸다 — 세리아 실측이 실리카 Kp를 흔들면 안 된다.</div></div>
        <div id="impResult"></div>
        <div class="sec" style="margin-top:14px">DB 현황</div>
        <div id="dbStats" class="meta">불러오는 중…</div>
        <div class="sec" style="margin-top:14px">실측 → Kp 보정 (현재 팩: ${state.pack})</div>
        <div id="calib" class="meta">불러오는 중…</div>
        <div class="sec" style="margin-top:14px">최근 실행</div>
        <div id="runList" class="meta"></div>`;
      continue;
    }
    if(f.special==="rotation"){
      /* P/H 한 칸 — 실제 레시피 표기(예: 55/60)와 같은 형태 */
      const p = num("rpm_platen", 55), hh = num("rpm_wafer", 60);
      h += `<div class="fld">
        <label><span>${f.l}</span>
          <span class="val"><span id="v-rpm_platen">${p}</span> / <span id="v-rpm_wafer">${hh}</span> rpm</span></label>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="width:14px;color:var(--dim);font-size:11px">P</span>
          <input type="range" id="r-rpm_platen" min="${f.min}" max="${f.max}" step="${f.step}" value="${p}" style="flex:1">
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:3px">
          <span style="width:14px;color:var(--dim);font-size:11px">H</span>
          <input type="range" id="r-rpm_wafer" min="${f.min}" max="${f.max}" step="${f.step}" value="${hh}" style="flex:1">
        </div>
        ${f.hint?`<div class="meta">${f.hint}</div>`:""}
      </div>`;
      continue;
    }
    if(f.special==="pack"){
      h += `<div class="fld"><label><span>${f.l}</span></label>
        <select id="sel-pack">${state.packs.map(p=>
          `<option value="${p.id}" ${p.id===state.pack?"selected":""}>${p.id} — ${p.description||""}</option>`
        ).join("")}</select>
        <div class="meta">막질을 바꾸는 것은 <b>파라미터 팩 한 장을 갈아끼우는 것</b>이다.
        코드를 고치지 않는다.</div></div>`;
      continue;
    }
    if(f.special==="wafertype"){
      h += `<div class="fld"><label><span>${f.l}</span></label>
        <select id="sel-wafer">
          <option value="NPW" ${state.wafer==="NPW"?"selected":""}>NPW — 블랭킷(패턴 없음)</option>
          <option value="PTW" ${state.wafer==="PTW"?"selected":""}>PTW — 패턴 웨이퍼</option>
        </select><div class="meta">PTW는 pattern_density 모델이 필요하다 —
        아니면 NPW 등가로 계산되고 경고가 뜬다.</div></div>`;
      continue;
    }
    const isTime = f.special==="time", isThick = f.special==="thick";
    const cur = isTime ? state.time_s
              : isThick ? state.initial_thickness_nm
              : num(f.k, f.min);
    const fmt = f.fmt || (v=>(+v).toFixed(String(f.step).includes(".")?2:0));
    h += `<div class="fld">
      <label><span>${f.l}</span><span class="val" id="v-${f.k}">${fmt(cur)} ${f.u||""}</span></label>
      <input type="range" id="r-${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${cur}">
      ${f.dead?`<div class="meta dead">⚠ 미연결: ${f.dead}</div>`:""}
      ${f.weak?`<div class="meta weak">${f.weak}</div>`:""}
      ${f.hint?`<div class="meta">${f.hint}</div>`:""}
    </div>`;
  }
  h += `<button class="btn" id="reset">기준 조건으로 되돌리기</button>`;
  document.getElementById("body").innerHTML = h;

  /* P/H 회전 두 슬라이더 — 각각 팩 키로 바인딩 */
  for(const key of ["rpm_platen","rpm_wafer"]){
    const el = document.getElementById("r-"+key);
    if(!el) continue;
    el.oninput = ()=>{
      const v = parseFloat(el.value);
      document.getElementById("v-"+key).textContent = v.toFixed(0);
      state.overrides[key] = v;
      run();
    };
  }
  for(const f of P.fields){
    if(f.section || f.special==="rotation") continue;
    const el = document.getElementById("r-"+f.k);
    if(!el) continue;
    const fmt = f.fmt || (v=>(+v).toFixed(String(f.step).includes(".")?2:0));
    el.oninput = ()=>{
      const v = parseFloat(el.value);
      document.getElementById("v-"+f.k).textContent = fmt(v)+" "+(f.u||"");
      if(f.special==="time") state.time_s = v;
      else if(f.special==="thick") state.initial_thickness_nm = v;
      else state.overrides[f.k] = v;
      if(f.k==="groove_pitch_mm"||f.k==="groove_depth_mm")
        buildGrooves(num("groove_pitch_mm",3.05), num("groove_depth_mm",0.76));
      if(f.k==="asperity_density_per_m2") buildGrits(v);
      run();
    };
  }
  const sp=document.getElementById("sel-pack");
  if(sp) sp.onchange=()=>{ state.pack=sp.value; state.overrides={}; boot(); };
  const sw=document.getElementById("sel-wafer");
  if(sw) sw.onchange=()=>{ state.wafer=sw.value; run(); };
  if(document.getElementById("drop")) wireDataTab();
  document.getElementById("reset").onclick=()=>{ state.overrides={}; drawPanel(); run(); };
}

/* ─────────────────────────────────────────── 데이터 탭 */
function wireDataTab(){
  const drop = document.getElementById("drop"), fin = document.getElementById("fileIn");
  drop.onclick = ()=>fin.click();
  drop.ondragover = e=>{ e.preventDefault(); drop.style.borderColor="var(--accent)"; };
  drop.ondragleave = ()=>{ drop.style.borderColor="var(--line)"; };
  drop.ondrop = e=>{ e.preventDefault(); drop.style.borderColor="var(--line)";
                     if(e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]); };
  fin.onchange = ()=>{ if(fin.files[0]) uploadFile(fin.files[0]); fin.value=""; };
  refreshDataPanel();
}

async function uploadFile(file){
  const out = document.getElementById("impResult");
  out.innerHTML = `<div class="meta">업로드 중: ${file.name} …</div>`;
  const fd = new FormData();
  fd.append("file", file);
  fd.append("pack_hint", document.getElementById("imp-pack").value);
  fd.append("label", file.name.replace(/\.[^.]+$/,""));
  try{
    const r = await fetch(API+"/api/import", {method:"POST", body:fd});
    const d = await r.json();
    if(!r.ok){ out.innerHTML = `<div class="banner">실패: ${d.detail||"unknown"}</div>`; return; }
    const map = Object.entries(d.column_mapping||{}).map(([k,v])=>`${v}→${k}`).join(", ");
    out.innerHTML = `
      <div class="banner" style="background:#14261c;border-color:#1f4a30;color:var(--good)">
        ✓ ${file.name} 저장됨 — ${d.n_points}포인트
        ${d.mrr_mean!=null?`, 실측 평균 MRR <b>${d.mrr_mean.toFixed(1)} nm/min</b>`:""}
      </div>
      <div class="meta">조건: ${JSON.stringify(d.conditions)}</div>
      <div class="meta">컬럼 매핑: ${map||"—"}</div>
      ${d.unmapped_columns?.length?`<div class="meta dead">⚠ 미매핑 컬럼(버리지 않고 기록만): ${d.unmapped_columns.join(", ")}</div>`:""}
      ${d.blockers?.length?`<div class="meta dead">⛔ ${d.blockers.join(" / ")}</div>`:""}
      ${d.warnings?.length?`<div class="meta weak">${d.warnings.join(" / ")}</div>`:""}
      ${!d.comparable?`<div class="meta dead">이 실측은 조건이 부족해 시뮬레이션과 <b>비교할 수 없다</b>. 저장은 됐다.</div>`:""}`;
    refreshDataPanel();
  }catch(e){ out.innerHTML = `<div class="banner">업로드 실패: ${e.message}</div>`; }
}

async function refreshDataPanel(){
  try{
    const rr = await (await fetch(API+"/api/runs?limit=8")).json();
    const s = rr.stats||{};
    document.getElementById("dbStats").innerHTML =
      `실행 <b>${s.runs||0}</b>건 · 실측 <b>${s.measurements||0}</b>건 · 임포트 ${s.imports||0}회<br>
       팩별 실측: ${JSON.stringify(s.measurements_by_pack||{})}<br>
       <span style="opacity:.6">${s.db_path||""}</span>`;
    document.getElementById("runList").innerHTML = (rr.runs||[]).map(r=>{
      const t = new Date(r.ts*1000).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
      const ov = Object.entries(r.inputs?.pack_overrides||{}).map(([k,v])=>`${k}=${v}`).join(" ");
      return `<div style="padding:2px 0;border-bottom:1px solid #1b2430">
        ${t} · ${r.pack} · MRR <b>${(r.mrr_mean||0).toFixed(1)}</b>
        ${ov?`<span style="opacity:.7"> · ${ov}</span>`:""}</div>`;
    }).join("") || "—";
    const c = await (await fetch(API+"/api/calibration/"+state.pack)).json();
    const badge = c.factor===1.0 ? "" : `<b style="color:var(--accent)">Kp ×${c.factor.toFixed(3)}</b> · `;
    document.getElementById("calib").innerHTML = `${badge}${c.note}`;
  }catch(e){ /* 패널 갱신 실패는 조용히 */ }
}

/* ─────────────────────────────────────────── 결과 */

  const cls = v<0.97?"lo":(v>1.03?"hi":"");
  return `<div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
          <div class="fval">${v.toFixed(3)}</div>`;
}

    <div class="sec">In-situ — Polish Timeline

    <div id="tl" class="meta">Run the timeline to see thickness vs. time, wafer cross-section by stack, temperature & carrier current traces.</div>

    <div class="sec">Tool Outputs — derived, not set</div>
    ${eqRow("pad_temp_c",1)}${eqRow("pad_temp_rise_k",2)}${eqRow("cof",4)}

    <div class="row" style="margin-top:7px;color:var(--dim);font-size:11px">

    <div class="sec">Engine-reported limits (${(d.notes||[]).length})</div>
    <div id="notes">${(d.notes||[]).slice(0,40).map(n=>
      `<div class="${n.includes("⚠")?"w":""}">${n}</div>`).join("")}</div>`;
  document.getElementById("tlBtn").onclick = runTimeline;
  document.getElementById("linBtn").onclick = showLineage;
  if(state.lineageOpen) showLineage();
}

/* 전문용어는 영어로 — 사용자 지시 */
const EQ_LABEL = {pad_temp_c:"Pad Temperature", pad_temp_rise_k:"Pad ΔT", cof:"COF (μ)",
  carrier_current_a:"Carrier Current", platen_torque_nm:"Platen Torque", friction_power_w:"Friction Power"};
const FACTOR_EN = {lambda:"Mech. Load", pi:"Load Profile", theta:"Thermal/Flow", gamma:"Conditioning",
  kappa:"Contact", chi:"Chem. Reactivity", psi:"Passivation", tau:"Slurry Transport",
  delta:"Damage", stab:"Stability"};

/* ─────────────────────────────────────────── Polish Timeline */
function currentStack(){
  /* 웨이퍼 탭의 스택. NPW 카탈로그가 연결되기 전엔 팩 막질 1층 + 기판 */
  if(state.stack && state.stack.length) return state.stack;
  const film = (state.packs.find(p=>p.id===state.pack)||{}).film || "film";
  return [{name:film, thickness_nm:state.initial_thickness_nm||1000, pack:state.pack, color:"#7fb3ff"},
          {name:"Si substrate", thickness_nm:775000, pack:null, stop:true, color:"#3a3f48"}];
}

async function runTimeline(){
  const box = document.getElementById("tl");
  box.innerHTML = `<div class="meta">Running…</div>`;
  const body = { layers: currentStack(), total_s: state.time_s||120, dt_s: 2,
                 pack_overrides: state.overrides };
  ["pressure_psi","platen_rpm","wafer_rpm","slurry_flow_ml_min"].forEach(k=>{
    const ov = state.overrides||{};
    const map = {pressure_psi:"pressure_psi", platen_rpm:"rpm_platen", wafer_rpm:"rpm_wafer", slurry_flow_ml_min:"sfr_ml_min"};
    if(ov[map[k]]!=null) body[k]=ov[map[k]];
  });
  try{
    const r = await fetch(API+"/api/timeline",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ box.innerHTML=`<div class="banner">${d.detail||"timeline failed"}</div>`; return; }
    state.timeline = d; drawTimeline(d);
  }catch(e){ box.innerHTML=`<div class="banner">${e.message}</div>`; }
}

function drawTimeline(d){
  const box = document.getElementById("tl");
  const n = d.frames.length;
  box.innerHTML = `
    <div class="row" style="font-size:11px"><span>t = <b id="tlT">0</b> s</span>
      <input type="range" id="tlS" min="0" max="${n-1}" value="0" style="flex:1;margin:0 8px">
      <button class="btn" id="tlPlay" style="padding:1px 8px;font-size:11px;margin:0">▶</button></div>
    <div class="meta" style="margin:2px 0 4px">${d.endpoint_s!=null?`Endpoint (all radii clear layer 1): <b>${d.endpoint_s}s</b>, first breakthrough ${d.layer_breakthrough_s[d.layers[0].name]}s`:"No endpoint within run time"}</div>
    <canvas id="tlX" width="360" height="110" style="width:100%;display:block;border-radius:6px;background:#0a0e14"></canvas>
    <div class="meta" style="margin:2px 0">Wafer cross-section (center → edge), vertical scale = film only</div>
    <canvas id="tlG" width="360" height="120" style="width:100%;display:block;border-radius:6px;background:#0a0e14;margin-top:4px"></canvas>
    <div style="display:flex;gap:10px;font-size:10px;color:var(--dim);margin-top:2px">
      <span><i style="display:inline-block;width:10px;height:3px;background:#7fb3ff"></i> thickness (center)</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#ff8a5c"></i> pad temp</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#a0e0a0"></i> MRR</span>
      <span><i style="display:inline-block;width:10px;height:3px;background:#e0c060"></i> COF</span></div>
    <div id="tlRow" style="font-size:11px;margin-top:4px"></div>
    ${d.notes.map(x=>`<div class="meta ${x.includes("⚠")?"dead":""}">${x}</div>`).join("")}`;
  const S = document.getElementById("tlS"), T = document.getElementById("tlT");
  const draw = i=>{ T.textContent = d.frames[i].t_s; drawXsec(d,i); drawTraces(d,i); showRow(d,i); };
  S.oninput = ()=>draw(+S.value);
  let timer=null;
  document.getElementById("tlPlay").onclick = function(){
    if(timer){ clearInterval(timer); timer=null; this.textContent="▶"; return; }
    this.textContent="❚❚"; let i=+S.value;
    timer=setInterval(()=>{ i=(i+1)%n; S.value=i; draw(i); if(i===n-1){clearInterval(timer);timer=null;this.textContent="▶";} }, 80);
  };
  draw(0);
}

function drawXsec(d,i){
  const c = document.getElementById("tlX"), g = c.getContext("2d"), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const f = d.frames[i], nr = d.radius_mm.length;
  const filmLayers = d.layers.filter(L=>!L.stop);
  const total0 = filmLayers.reduce((s,L)=>s+L.thickness_nm,0);
  const pad=6, top=10, bot=H-8, sc=(bot-top)/total0;
  /* 기판 */
  g.fillStyle = "#2a2f38"; g.fillRect(pad,bot,W-2*pad,6);
  for(let r=0;r<nr;r++){
    const x0 = pad + (W-2*pad)*r/nr, x1 = pad + (W-2*pad)*(r+1)/nr + 0.5;
    let y = bot;
    for(let k=d.layers.length-1;k>=0;k--){
      const L=d.layers[k]; if(L.stop) continue;
      const rem = f.remaining_nm[k][r]; if(rem<=0) continue;
      const h = rem*sc; g.fillStyle=L.color; g.fillRect(x0,y-h,x1-x0,h); y-=h;
    }
  }
  /* 초기 두께 점선 */
  g.strokeStyle="rgba(255,255,255,.25)"; g.setLineDash([3,3]); g.beginPath(); g.moveTo(pad,top); g.lineTo(W-pad,top); g.stroke(); g.setLineDash([]);
  g.fillStyle="rgba(255,255,255,.55)"; g.font="9px sans-serif";
  g.fillText("center",pad+2,H-12); g.fillText("edge",W-pad-24,H-12);
  let ly=top+9; d.layers.forEach(L=>{ if(L.stop) return; g.fillStyle=L.color; g.fillRect(W-70,ly-7,8,8); g.fillStyle="#ccc"; g.fillText(`${L.name} ${L.thickness_nm}nm`,W-58,ly); ly+=11; });
}

function drawTraces(d,i){
  const c = document.getElementById("tlG"), g = c.getContext("2d"), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const n=d.frames.length, pad=6;
  const series = [
    {k:f=>f.remaining_nm[0][0], col:"#7fb3ff"},
    {k:f=>f.outputs.pad_temp_c, col:"#ff8a5c"},
    {k:f=>f.mean_mrr, col:"#a0e0a0"},
    {k:f=>f.outputs.cof, col:"#e0c060"},
  ];
  series.forEach(s=>{
    const vals = d.frames.map(s.k); const fin = vals.filter(v=>v!=null);
    if(!fin.length) return;
    const lo=Math.min(...fin), hi=Math.max(...fin), rng=(hi-lo)||1;
    g.strokeStyle=s.col; g.lineWidth=1.5; g.beginPath(); let started=false;
    vals.forEach((v,j)=>{ if(v==null){started=false;return;} const x=pad+(W-2*pad)*j/(n-1), y=H-pad-(H-2*pad)*(v-lo)/rng;
      if(!started){g.moveTo(x,y);started=true;} else g.lineTo(x,y); });
    g.stroke();
  });
  const x=pad+(W-2*pad)*i/(n-1); g.strokeStyle="rgba(255,255,255,.5)"; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
  if(d.endpoint_s!=null){ const j=d.frames.findIndex(f=>f.t_s>=d.endpoint_s); if(j>=0){ const xe=pad+(W-2*pad)*j/(n-1); g.strokeStyle="#ff5c5c"; g.setLineDash([2,2]); g.beginPath(); g.moveTo(xe,0); g.lineTo(xe,H); g.stroke(); g.setLineDash([]); } }
}

function showRow(d,i){
  const f=d.frames[i], o=f.outputs;
  const ex = f.exposed_layer; const cnt={}; ex.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const exposed = Object.entries(cnt).map(([k,v])=>`${d.layers[k].name} ${(100*v/ex.length).toFixed(0)}%`).join(", ");
  document.getElementById("tlRow").innerHTML =
    `<div class="row"><span>Exposed</span><b>${exposed}</b></div>
     <div class="row"><span>Thickness center / edge</span><b>${f.remaining_nm[0][0].toFixed(0)} / ${f.remaining_nm[0][f.remaining_nm[0].length-1].toFixed(0)} nm</b></div>
     <div class="row"><span>MRR</span><b>${f.mean_mrr.toFixed(1)} nm/min</b></div>
     <div class="row"><span>Pad Temp</span><b>${o.pad_temp_c!=null?o.pad_temp_c.toFixed(1)+" °C":"—"}</b></div>
     <div class="row"><span>COF / Torque</span><b>${o.cof!=null?o.cof.toFixed(3):"—"} / ${o.platen_torque_nm!=null?o.platen_torque_nm.toFixed(1)+" N·m":"—"}</b></div>
     <div class="row"><span>Carrier Current</span><b>${o.carrier_current_a!=null?o.carrier_current_a.toFixed(2)+" A":'<span style="color:var(--warn)">needs motor K_t</span>'}</b></div>`;
}

/* ─────────────────────────────────────────── Parameter Lineage */
async function showLineage(){
  state.lineageOpen = true;
  const box = document.getElementById("lineage");
  box.innerHTML = `<div class="meta">Loading…</div>`;
  const d = await (await fetch(API+"/api/factors/lineage/"+state.pack)).json();
  const conf = c=>({verified:"var(--good)",literature:"#8ab4d8",estimated:"var(--warn)"}[c]||"var(--dim)");
  box.innerHTML = `<div class="meta" style="margin:6px 0">Each merged parameter, what inputs feed it, how each term contributes, and its sources. Click a symbol to rename (1–3 chars, empty = default).</div>` +
    d.factors.map(f=>`
    <div style="border:1px solid #1b2430;border-radius:6px;padding:6px 8px;margin:4px 0">
      <div style="display:flex;align-items:center;gap:8px">
        <input value="${f.symbol}" data-k="${f.key}" class="symIn" maxlength="3"
          style="width:34px;text-align:center;font-weight:700;font-size:15px;background:#0a0e14;border:1px solid #1b2430;border-radius:4px;color:var(--accent)">
        <b>${FACTOR_EN[f.key]||f.name}</b>
        <span class="tag ${f.status}">${f.status}</span>
        <span style="margin-left:auto;font-size:10px;color:${conf(f.confidence)}">${f.confidence}</span></div>
      <div style="font-size:11px;margin-top:4px">
        <div><span style="color:var(--dim)">Inputs →</span> ${Object.entries(f.drivers).map(([k,v])=>`<code>${k}</code>=${typeof v==="number"?+v.toPrecision(4):v}`).join(" · ")||'<span style="color:var(--warn)">none wired</span>'}</div>
        <div><span style="color:var(--dim)">Terms</span> ${Object.entries(f.terms).map(([k,v])=>`${k}×${(+v).toFixed(3)}`).join(" · ")||"—"}
          ${f.value!=null?`<b style="margin-left:6px">= ${f.value.toFixed(3)}</b>`:""}</div>
        <div><span style="color:var(--dim)">Affects MRR</span> ${f.mrr_coupled?"yes (multiplies)":"no (diagnostic only)"} · <span style="color:var(--dim)">Change via</span> ${f.parts.map(p=>PARTS[p]?PARTS[p].name:p).join(", ")}</div>
        ${f.sources.length?`<div style="color:var(--dim)">Sources: ${f.sources.map(s=>`<span title="${s}">${s.split("/").pop().slice(0,40)}</span>`).join("; ")}</div>`:""}
        ${f.status==="unmodeled"?`<div class="dead">${(f.notes||[]).join(" ")||"Not modeled — required parameters missing from pack."}</div>`:""}
      </div></div>`).join("");
  box.querySelectorAll(".symIn").forEach(inp=>{
    inp.onchange = async ()=>{
      const r = await fetch(API+"/api/factors/symbols",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({symbols:{[inp.dataset.k]:inp.value}})});
      const res = await r.json();
      if(!r.ok){ alert(res.detail); return; }
      state.symbols = state.symbols||{}; 
      const fresh = await (await fetch(API+"/api/factors")).json();
      state.symbols = Object.fromEntries(fresh.factors.map(f=>[f.key,f.symbol]));
      run();
    };
  });
}

async function run(){
  const body = { pack:state.pack, wafer:state.wafer, time_s:state.time_s,
                 initial_thickness_nm:state.initial_thickness_nm,
                 pack_overrides:state.overrides };
  try{
    const r = await fetch(API+"/api/simulate/v2",
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok){ document.getElementById("out").innerHTML =
      `<div class="banner">엔진 오류: ${d.detail||"unknown"}</div>`; return; }
    render(d);
    /* 실행 결과 → 3D 반영 (패드 온도 틴트·웨이퍼 발광·슬러리 퍼짐) */
    if(typeof applyResult==="function") applyResult(d);
    else { const mr = d.mean_mrr_nm_min||0;
           waferMat.emissiveIntensity = THREE.MathUtils.clamp(mr/260, .12, 1.1); }
    state.lastRunId = d.run_id||null;
  }catch(e){
    document.getElementById("out").innerHTML =
      `<div class="banner">API 연결 실패: ${e.message}</div>`;
  }
}

async function boot(){
  try{
    const cat = await (await fetch(API+"/api/catalog")).json();
    state.packs = (cat.packs||[]).filter(p=>!p.error);
    try{ const fs = await (await fetch(API+"/api/factors")).json();
         state.symbols = Object.fromEntries(fs.factors.map(f=>[f.key,f.symbol])); }catch(e){}
    const pk = state.packs.find(p=>p.id===state.pack);
    state.base = {};
    if(pk) for(const p of pk.params) if(typeof p.value==="number") state.base[p.key]=p.value;
    buildGrooves(num("groove_pitch_mm",3.05), num("groove_depth_mm",0.76));
    buildGrits(num("asperity_density_per_m2",1e11));
  }catch(e){ /* 카탈로그 실패해도 시뮬은 돈다 */ }
  drawTabs(); drawPanel(); run();
}
boot();
</script>
