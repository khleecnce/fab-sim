  ## 2) 확보한 실측 문헌 (모두 1차 출처, 본문 확인)
  a. **Lee 2025** Nanomaterials 15(16) 1248 (OA, PMC12388451) — 콜로이달 실리카 슬러리
     0.98~1.13 cP, Brookfield DV-II+Pro. 첨가제 농도별 계열값 다수.
  b. **Kim 2024b** Polymers 16(24) 3593 (OA, PMC11679047) — 상용 세리아 1.41 cP(초기),
     자체제조 1.44~1.62 cP. 전단속도 의존성 서술(상용=Newtonian, 자체제조=thixotropic→Newtonian).
  c. **Kim 2024a** Polymers 16(6) 844 (OA, PMC10974854) — Table 3/4에 세리아 슬러리
     1.31~1.35 cP가 **표로** 실려 있다(±0.01~0.03 오차 포함).
  d. **Crawford 2013** Colloids Surf. A 436, 87-96 (DOI 10.1016/j.colsurfa.2013.06.003) —
     **CMP 실공정 전단속도에서 직접 잰 유일한 확보 문헌**. AR-G2 평행판 gap 30 µm,
     1,000~100,000 /s. DI water 대조 8.6e-4 Pa·s(문헌값 3.4% 이내)로 측정계 검증.
     25 wt% 퓸드실리카는 전단박화(-40%), +0.15 M KCl은 30,000 /s에서 전단증점 개시 5배.
     미러 사이트 미러로 PDF 확보 → papers/crawford2013-colsurfa-fumed-silica-shear-thickening.pdf.

  ## 3) 전단속도 판단 — 왜 Brookfield(저전단) 값을 CMP 영역에 써도 되는가
  지시대로 CMP 전단속도 영역(10^3~10^5 /s)의 값을 골라야 한다. 확보한 cP 실측값들은
  회전식 점도계(저전단) 측정이다. 그럼에도 채택한 근거는 두 가지다:
  (i) Kim 2024b가 상용 세리아 분산제를 "Newtonian behavior, viscosity is linear and
      independent of shear rate"로 **명시**,
  (ii) Crawford가 같은 장비로 잰 물·희박계가 1,000~100,000 /s 전 구간에서 전단속도 무관.
  → 희박 수계 슬러리에 한해 저전단 값의 고전단 외삽이 정당하다. **다만 이 외삽 자체는
  미검증으로 노트 §4 한계 2에 명기했다.**
  반대로 25 wt% 급 고고형분+고이온강도 슬러리는 CMP 전단영역 안(30,000 /s)에서 5배(비가역 시
  ~100배) 증점하므로 단일 스칼라가 **물리적으로 틀린다** — 엔진 적용범위 주석 필요.

