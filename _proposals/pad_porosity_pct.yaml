# pad_porosity_pct 승격 제안 — estimated → literature
# 작성: 2026-09-11 | git commit 하지 않음. sim/ 및 knowledge/params/ 미수정(제안만).

key: pad_porosity_pct
target_file: knowledge/params/base.yaml
proposed:
  value: 30.0
  unit: "%"
  note: >
    IC1000 캐스트 PU 패드의 문헌 명시 기공률. Sikder et al. 2001 (MRS Proc. 697, P9.3,
    DOI 10.1557/proc-697-p9.3) §III 첫 단락 원문: "Typical polyurethane pads, either
    perforated or grooved IC 1000, consist of pores or voids of an average diameter of
    about 30 µm; voids account for approximately 30% of the volume of the pad."
    SEM 단면(원문 Fig. 2) 관찰 근거의 서술값이며 오차막대·측정법 명시는 없다.
    교차확인: Yang 2010(DOI 10.1016/j.ijmachtools.2010.06.007) IC-1010 밀도 역산 ≈37.1%,
    Prasad 2013 Table III 상용 D100 행 14%. 상용 패드 산포는 23%p로 크므로 30.0%는
    "IC1000의 값"으로만 유효하다(모든 상용 패드의 평균이 아님).
  source: knowledge/materials/commercial-cmp-pad-porosity-literature-values.md §3
