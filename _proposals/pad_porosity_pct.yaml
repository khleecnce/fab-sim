companion:
  key: pad_ref_porosity_pct
  target_file: knowledge/params/base.yaml
  proposed:
    value: 30.0
    unit: "%"
    note: >
      τ 기준점 — pad_porosity_pct와 같은 값(IC1000 30%). 두 키를 함께 옮기면
      τ 기공 팩터는 1.000 불변(노트 §5 verify (5)에서 assert).
    source: knowledge/materials/commercial-cmp-pad-porosity-literature-values.md §3
