      꼬리를 개수축(>1 µm particles/mL: 50,354 / 350,561 / 62,542 / 384,556)으로만 보고한다.
      이 개수축은 D99로 환산 불가능하다 — 30 wt%·D50 55 nm 구형 환산 시 전체 개수농도가
      1.872e15/mL 이라 50,354/mL 은 개수분율 2.69e-11, 즉 D99(분율 1e-2)와 **8.6 자릿수**
      떨어져 있다. 그 간극을 메우려면 분포 형상 σ_g 를 알아야 하는데 그것이 곧 구하려는
      미지수라 순환이다(노트 §2.2 verify 블록이 assert 로 고정). 제조사 데이터시트
      (Evonik IDISIL KE)·Fujifilm 초순수 콜로이달 실리카 특허(US20070254964A1/US8211193B2,
