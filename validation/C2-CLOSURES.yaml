# C2 종결 원장 — confidence < literature 인 칸 중 "문헌 부재가 3회차 규칙으로 영구 종결된" 것만 등록.
#
# 이 파일은 값도 confidence 도 바꾸지 않는다. estimated/unverified 는 그대로 남는다.
# 바꾸는 것은 완성 판정의 기준이다 — "안 했다"(미조사)와 "못 한다"(3회차 소진, 구조적 문헌 부재)를
# 구분하되, 후자를 주장하려면 **기계로 검증 가능한 증거**를 대야 한다:
#   (1) judgments 의 각 판정 번호가 EVIDENCE-RULES.md 판정표에 실존하고,
#   (2) 그 행에 "종결" 문구가 있으며,
#   (3) note 경로의 노트 파일이 실제로 존재한다.
# 셋 중 하나라도 어긋나면 그 칸은 종결로 인정되지 않고 그냥 C2 미충족으로 돌아간다.
# 근거 서술 원본: validation/C2-RESIDUAL-CLASSIFICATION.md (2026-09-15)
#
# ⚠ 재오픈: 각 항목 reopen_if 에 적힌 새 근거가 나타나면 종결은 무효다. 그때는 이 파일에서
#    해당 항목을 지우고 정상 재판정 절차(EVIDENCE-RULES §절차)를 다시 밟는다.

