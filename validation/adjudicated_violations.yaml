# 판정으로 종결돼 **의도적으로 남겨 둔** 위생 위반 원장
# ─────────────────────────────────────────────────────────────────────────
# 이 파일은 위반을 **끄지 않는다.** 검사기는 여전히 위반을 신고하고 exit 1 을
# 낸다. 이 파일이 바꾸는 것은 단 하나 — 그 위반이 "이번에 새로 생긴 것"인지
# "이미 판정으로 종결돼 남겨 두기로 한 것"인지를 다음 회차가 구분할 수 있게
# 하는 것이다.
#
# 왜 필요한가 (2026-09-16)
# ────────────────────────
# EVIDENCE-RULES 판정#39 가 ψ 범위 위반 2건을 "독립 결함이 아니라 종결된 갭의
# 하류 증상"으로 판정하고 **남겨 두기로** 결정했다. 그런데 최적화 루프는 매
# 회차 "🔴 물리 위반 2건 — 다른 무엇이 좋아졌든 이것부터 고쳐라"를 출력한다.
# 그 결과 매 회차가 같은 판정을 다시 하거나, 더 나쁘게는 검사기를 침묵시키려
# 형상 파라미터를 만지게 된다(= 물리가 아니라 검사기를 튜닝하는 일).
#
# 규칙
# ────
# 1. 여기 등록해도 **위반은 계속 신고된다.** severity 는 error 그대로다.
# 2. 등록에는 반드시 `ruling`(판정 번호) + `reason` + `reopen` 이 있어야 한다.
#    셋 중 하나라도 비면 등록은 무효다 — 사유를 못 쓰면 종결이 아니다.
# 3. `match` 는 위반 제목에 대한 부분 문자열이다. 넓게 쓰지 마라 —
#    넓은 패턴은 아직 생기지 않은 다른 위반까지 미리 덮는다.
# 4. 등록된 위반의 **수치가 바뀌면 자동으로 등록이 풀린다**(`value` 대조).
#    모델이 달라졌는데 옛 판정이 따라오는 것이 이 장치의 유일한 위험이다.

