#
# 출처: Wang et al., "Machine Learning-Driven Optimization of Silicon Carbide
#       Chemical Mechanical Polishing with Surface Roughness Constraints",
#       ACS Supporting Information, Table S3 "Original Polish dataset"
# 라이선스: CC BY-NC 4.0
# PDF: https://ndownloader.figshare.com/files/60987447 (859,882 B, 22p, 2026-09-08 직접 확인)
#
# ⚠ 재료계가 4H-SiC라 우리 팩(Si 산화막/Cu/W)의 범위 밖 → in_scope: false.
#   그러나 **조성(CeO2 wt%, H2O2 vol%, pH)과 압력·rpm이 전부 절대값으로 있는
#   완전 DOE**다. 지금까지 모은 데이터 중 조성이 들어간 유일한 것이고,
#   화학층의 경향(순위)을 검증할 수 있는 첫 데이터다.
#
# 수준: CeO2 2/4/6 wt% · H2O2 2/4/6 vol% · pH 9/10/11
#       압력 4.5/5.0/5.5 psi · head 60/80 rpm · platen 60/80 rpm
#
# ⚠ 단위 변환: 원문은 nm/h. 하네스는 nm/min을 기대하므로 /60 했다.
#   원문값은 measured_mrr_nm_per_hour에 함께 남긴다(추적 가능하게).

