# US9368367B2 -- Cabot Microelectronics, "Chemical mechanical polishing of silicon
# carbide using soft particles and/or soft surfaces" -- Example 1, pH/KMnO4 series
#
# 출처: US9368367B2 (Google Patents, 원문은 Cloudflare 차단으로 FreePatentsOnline
#       https://www.freepatentsonline.com/9368367.html 에서 확보, 2026-09-13)
# 특허 상태: 등록특허, 전문 무료 공개, 저작권 문제 없음(사용자 지시 2026-09-05)
#
# Example 1: MnCl3/MnO2 "in-situ formed soft particle" 슬러리 (0.023M MnCl2 +
#   0.015M KMnO4 반응으로 생성, Mohs<3) + 잔여 KMnO4 산화제. Si-face 4H-SiC,
#   Buehler 장비, 압력 6.4 psi, 90 rpm. pH 2~9, KMnO4 0.02~0.4M 조건 6개.
#
# WARNING 재료계 정합성: 이 팩(sic_ceria_h2o2)은 abrasive=ceria, oxidizer=H2O2로
#   정의됐다. 이 데이터는 연마입자가 MnO2/MnCl3(soft particle, ceria 아님), 산화제가
#   KMnO4(H2O2 아님)이다. 따라서 sim/chemistry.py의 _ceria_term(abrasive=='ceria'
#   조건부)은 발동하지 않는다. 단 _ph_softening_term은 abrasive 무관하게
#   slurry_ph/ph_softening_ref/ph_softening_per_unit만 요구하므로, 이 데이터로
#   **pH 항만** 테스트할 수 있다 (entegris2022 alumina 데이터셋이 kappa 기계항만
#   테스트한 것과 동일한 패턴). oxidizer(KMnO4) 항도 oxidizer_wt_pct로 매핑 가능
#   (mol/L -> wt% 환산 필요, 아래 참고) -- _oxidizer_term은 화학종 무관 범용 Kaufman
#   단봉 모델이라 발동한다.
#
# 단위 환산: KMnO4 M -> wt%. KMnO4 몰질량 158.03 g/mol, 수용액 밀도 ~1.0 g/mL 근사.
#   0.4M -> 0.4*158.03/1000*100 = 6.32 wt% (근사, 희석수용액이라 밀도 1.0 가정 -- 미검증)
#   0.1M -> 1.58 wt%, 0.02M -> 0.316 wt%
#
# rpm: 특허 원문은 "50-200 rpm"이며 이 실시예는 "90 rpm" 단일값만 명시 (헤드/플래튼
#   구분 없음 -- Buehler 탁상형 연마기는 통상 플래튼-헤드 동일 rpm 공동회전 방식이라
#   rpm_platen=rpm_wafer=90으로 둔다. 미검증(원문에 개별 명시 없음).
#
# read_method: table (원문 표, "pH Concentration KMnO4(M) Removal Rate nm/hr"
#   2 0.4 1400 / 4 0.4 1290 / 6.5 0.4 560 / 9.0 0.4 360 / 4.0 0.1 360 / 3.0 0.02 100)
#
# 단위 변환: nm/hr -> nm/min: /60

doi: "US9368367B2 (FreePatentsOnline full text, Example 1 Table)"
source: "Cabot Microelectronics, US9368367B2, Example 1 -- Si-face 4H-SiC CMP, in-situ MnO2/MnCl3 soft particle + KMnO4 oxidizer, pH/[KMnO4] series"
read_method: table
pack: sic_ceria_h2o2
in_scope: true
used_for_calibration: false
scope_note: >
  재료계 불일치(연마입자 MnO2/MnCl3 vs 팩의 ceria, 산화제 KMnO4 vs 팩의 H2O2) --
  _ceria_term(ceria 전용)은 발동하지 않고, _ph_softening_term(화학종 무관)과
  범용 _oxidizer_term(Kaufman 단봉, 화학종 무관)만 테스트한다. sic_ceria_h2o2의
  ph_softening_per_unit은 Wang et al. DOE에서 역산됐으므로 이 데이터셋은 그
  계수의 진짜 held-out 검증이다(자기 답안지 아님 -- 다른 논문, 다른 산화제).

conditions:
  - label: "Ex1-1: pH2 KMnO4 0.4M"
    mrr_nm_per_min: 23.333
    measured_mrr_nm_per_hour: 1400.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 2.0
      oxidizer_wt_pct: 6.32
  - label: "Ex1-2: pH4 KMnO4 0.4M"
    mrr_nm_per_min: 21.5
    measured_mrr_nm_per_hour: 1290.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 4.0
      oxidizer_wt_pct: 6.32
  - label: "Ex1-3: pH6.5 KMnO4 0.4M"
    mrr_nm_per_min: 9.333
    measured_mrr_nm_per_hour: 560.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 6.5
      oxidizer_wt_pct: 6.32
  - label: "Ex1-4: pH9.0 KMnO4 0.4M"
    mrr_nm_per_min: 6.0
    measured_mrr_nm_per_hour: 360.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 9.0
      oxidizer_wt_pct: 6.32
  - label: "Ex1-5: pH4.0 KMnO4 0.1M"
    mrr_nm_per_min: 6.0
    measured_mrr_nm_per_hour: 360.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 4.0
      oxidizer_wt_pct: 1.58
  - label: "Ex1-6: pH3.0 KMnO4 0.02M"
    mrr_nm_per_min: 1.667
    measured_mrr_nm_per_hour: 100.0
    pressure_psi: 6.4
    rpm_platen: 90
    rpm_wafer: 90
    overrides:
      slurry_ph: 3.0
      oxidizer_wt_pct: 0.316
