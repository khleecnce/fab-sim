# 구리 CMP — Jani 2025 5인자 RSM 조성 DOE (held-out, 조성 3축 동시 변화)
source: >
  C. Jani, R. Venkataswamy, J. Seo, S. Krishnan,
  "Revisiting the Roles of Chelator, Inhibitor, Oxidant, and Abrasive in High-Rate Copper CMP",
  ECS J. Solid State Sci. Technol. 14(4) 044003, 2025. doi:10.1149/2162-8777/adc59e
  (CC-BY 오픈액세스, 전문 로컬 보관: papers/jani2025-revisiting-roles-cu-cmp.html)
  옮긴 곳: Table I(조성) × Table II(Cu RR). **표에 인쇄된 값만** — 그래프 판독 없음.
  고정 공정(원문 Experimental, 전 실험 동일): CETR-CP-4, IK4250H 패드, 3.0 psi,
  platen 90 rpm, 슬러리 150 mL/min, pH 3.0, 실리카 Z-평균 33 nm,
  2인치 Cu 디스크 질량감량법(8.96 g/cm3, 20.27 cm2).

# ── 선정 규칙 (자기채점 방지) ──────────────────────────────────────
#  · 캘리브레이션에 쓰인 Expt 30/31/32(oxidizer_acid_chelator_K)와
#    16/33(같은 노트 §9 한계 서술의 근거)은 **제외**.
#  · 실리카 0 wt%(무연마입자) 조건은 이 팩(연마입자 계)의 범위 밖이라 제외.
#  · 복제쌍(5/6, 7/8, 10/11, 13/14, 27/28)은 산술평균 1점으로 묶었다.
#  · **판정#72 적합에 쓴 4조건(E5/6, E7/8, E15, E27/28)도 제외** —
#    chelator_suppression_a(=1.5119)가 이 두 쌍의 비에서 역산됐으므로 남겨두면
#    자기 답안지로 채점하는 것이다(qa_loop F4 가 실제로 이걸 잡았다).
#  → 남은 13조건. 전부 held-out(used_for_calibration: false).
#
# ⚠ 미모델링 변수를 정직하게 적는다:
#   · 옥살산 농도(0.02~0.08 M)는 이 팩에 대응 파라미터가 없다. 같은 논문 회귀에서
#     [oxalic acid]=+536.63(p=1.7e-7)로 **가장 강한 인자**다 — 이 데이터셋의 잔차
#     상당 부분이 그 미모델링에서 온다. 이것이 이 데이터셋의 ρ가 낮은 주된 이유로
#     예상되며, 다음 회차 C1 갭 후보다.
#   · DOSS(계면활성제) 0.001~0.005 M 도 미연결.
#   · 절대값: 이 계열은 계통 편향이 크다 — 순위 전용.
in_scope: true
used_for_calibration: false
pack: cu_h2o2_bta

