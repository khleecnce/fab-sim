notes: >
  조성 3축(실리카·H2O2·글리신)이 동시에 바뀌는 RSM 설계라 1축 스윕보다 어렵다.
  글리신은 2026-09-19 판정#72로 ψ 에 배선됐고(chelator_suppression_a), 옥살산·DOSS는
  여전히 미모델링이다. 억제제(BTA)는 이 계열에 없어 inhibitor_mM: 0.0 으로 둔다 —
  그러면 ψ 억제 항이 기준(1.0 mM)보다 낮아 ψ>1 경고가 뜨는데, 그건 모델 고장이
  아니라 "기준점이 범위 하단이 아니다"는 기존 신고다(factors.py ψ 정의 위반 검사).
